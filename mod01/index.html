<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>360° Asertif MOD-01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#18213a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: aplikasi satu layar, kolom tunggal maks 480px. Konten tampil di panel lembut/gelap, pilihan selalu kartu putih bergaris tepi */
:root{
  --navy:#18213a; --navy-2:#24304f; --ink:#18213a; --muted:#68738a; --line:#dde3ee;
  --bg:#f5f7fb; --page:#e8ecf4; --white:#ffffff;
  --primary:#2d5be3; --primary-soft:#edf1fd; --primary-line:#b9c8f4;
  --accent:#ffc947; --accent-soft:#fff6dc; --accent-ink:#4a3600;
  --ok:#17a057; --ok-soft:#e6f6ec; --bad:#e5484d; --bad-soft:#fdeced;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--navy);color:#fff;min-height:50px}
.top .ttl{font-family:var(--display);font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pts{font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.tag-latihan{font:700 11px var(--body);letter-spacing:.06em;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:3px 7px}
.stripe{height:4px;background:linear-gradient(90deg,#2f6fd0 0 64%,#f2c230 64% 76%,#e2463d 76% 100%)}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-block:16px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
#stage>*{flex-shrink:0}
#stage>.grow{flex-shrink:1}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;font-weight:700} h2{font-size:24px;font-weight:600} h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.lbl{font:700 13px var(--body);color:var(--muted)}
.lbl.c{text-align:center}
/* tombol aksi: gelap; pilihan jawaban: putih bergaris tepi */
.btn{font:600 17px var(--display);letter-spacing:.01em;border:0;border-radius:14px;padding:14px 18px;background:var(--navy);color:#fff;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--navy);color:#fff}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.grow{flex:1}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.panel{background:var(--white);border-radius:18px;padding:16px;border:1px solid var(--line)}
input.nik{font:600 24px var(--display);letter-spacing:.08em;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;width:100%;background:#fff;color:var(--ink)}
input.nik:focus{border-color:var(--primary);outline:none}
.av-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.av-pick button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 6px 12px;cursor:pointer;font:600 17px var(--display);color:var(--ink)}
.av-pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.av-pick svg{width:100%;height:auto;display:block}
.face-lg svg{width:150px;height:auto}
.face-md svg{width:96px;height:auto}
.face-sm svg{width:64px;height:auto}
.meter{display:flex;align-items:center;gap:8px;font:600 13px var(--body);color:var(--muted)}
.meter .bar{flex:1;height:8px;border-radius:99px;background:#e3e8f1;overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:var(--ok);transition:width .35s}
/* arcade */
.hud{display:flex;justify-content:space-between;align-items:center;font:600 15px var(--display)}
.lives{display:flex;gap:4px}
.lives i{width:16px;height:16px;border-radius:50%;background:var(--bad);display:inline-block}
.lives i.off{background:#d4dae5}
.arena{position:relative;flex:1;min-height:300px;display:flex;align-items:center;justify-content:center;touch-action:none}
.hint{position:absolute;font:700 12px var(--body);letter-spacing:.06em;color:var(--muted)}
.hint.l{left:4px;bottom:4px}.hint.r{right:4px;bottom:4px}.hint.t{top:0;left:50%;transform:translateX(-50%)}
.card{position:relative;width:min(330px,92%);background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(24,33,58,.10);padding:14px 14px 22px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;user-select:none;cursor:grab;transition:transform .18s}
.card.drag{transition:none}
.card .dir{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--primary)}
.bubble{position:relative;background:var(--primary-soft);border-radius:16px;padding:10px 14px;font:600 18px var(--display);line-height:1.25;margin-bottom:8px;color:var(--ink)}
.bubble::after{content:"";position:absolute;left:22%;bottom:-9px;border:9px solid transparent;border-top-color:var(--primary-soft);border-bottom:0}
.bubble.act{background:#f0f2f6;color:var(--muted);font-style:italic;font-weight:500}.bubble.act::after{border-top-color:#f0f2f6}
.duo{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.duo figure{margin:0;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.duo svg{width:100%;max-width:92px;height:auto;display:block}
.duo figcaption{font:700 11px var(--body);color:var(--muted);margin-top:2px}
.card .tbar{position:absolute;left:14px;right:14px;bottom:10px;height:4px;border-radius:9px;background:#eef1f6;overflow:hidden}
.card .tbar b{display:block;height:100%;background:var(--accent)}
.card.flip{background:#fff;border-color:var(--bad)}
.card .verdict{font:700 24px var(--display)}
.choice3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.choice3 button{font:600 15px var(--display);border:0;border-radius:12px;padding:14px 4px;color:#fff;cursor:pointer}
.c-p{background:#7d879b}.c-a{background:var(--ok)}.c-g{background:var(--bad)}
.combo{position:absolute;top:8px;right:8px;font:700 13px var(--display);background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:99px}
.pop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:700 34px var(--display);color:var(--ok);opacity:0}
.pop.show{animation:pop .5s ease-out}
@keyframes pop{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.3) translateY(-20px)}}
/* babak 1: papan (konten) vs kepingan (pilihan) */
.scene{display:flex;align-items:center;gap:12px}
.scene .say{background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;font-weight:600;font-size:15px;flex:1;min-width:0}
.board{background:var(--primary-soft);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.55);border:1.5px dashed var(--primary-line);border-radius:12px;padding:6px 10px;min-height:40px}
.slot b{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--primary);width:84px;flex:none}
.slot span{font-size:14px;font-weight:600}
.slot.next{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slot.taken{border-style:solid;border-color:transparent;background:#fff}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
button.slot{font:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer}
button.slot:disabled{cursor:default;opacity:1}
.slot span em{display:block;font-style:normal;font-size:12.5px;color:var(--ok);margin-top:2px}
.pieces{display:flex;flex-direction:column;gap:8px}
.piece{position:relative;font:600 15px var(--body);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 44px 12px 14px;color:var(--ink);cursor:pointer}
.piece::after{content:"+";position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font:700 16px/22px var(--display);text-align:center}
.piece:active{border-color:var(--primary)}
.fb{min-height:22px;font-weight:700;font-size:15px;color:var(--bad);text-align:center}
.fb.good{color:var(--ok)}
.k-eyebrow{font:700 12px var(--body);letter-spacing:.12em;color:var(--primary)}
.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:10px}
.howto li{counter-increment:h;display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.4}
.howto li::before{content:counter(h);flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font:700 13px var(--display);display:flex;align-items:center;justify-content:center}
/* babak 2 chat */
.chat-head{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;border:1px solid var(--line)}
.chat-head .who{flex:1;min-width:0}
.chat{display:flex;flex-direction:column;gap:8px;flex:1}
.bub{max-width:82%;padding:10px 12px;border-radius:16px;font-size:15px;font-weight:600;line-height:1.35}
.bub.her{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bub.act{align-self:center;background:transparent;color:var(--muted);font-style:italic;font-weight:500;text-align:center;font-size:14px}
.bub.sys{align-self:center;background:var(--navy);color:#fff;border-radius:10px;font-size:14px}
.att{display:flex;gap:6px;margin-top:6px}
.att span{background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;font:600 15px var(--body);text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 40px 12px 14px;cursor:pointer}
.opt::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--primary);font:700 20px var(--display)}
.opt:active{border-color:var(--primary)}
.tip{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--accent-ink);text-align:center}
/* babak 3: kartu situasi gelap di tengah, 4 pilihan putih */
.compass{display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-rows:auto 1fr auto;gap:8px;align-items:center;justify-items:center}
.cdir{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:10px 6px;font:600 15px var(--display);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.cdir svg{width:24px;height:24px}
.cdir:active{border-color:var(--primary)}
.cdir.n{grid-column:2;grid-row:1}.cdir.e{grid-column:3;grid-row:2}.cdir.s{grid-column:2;grid-row:3}.cdir.w{grid-column:1;grid-row:2}
.cdir.right{background:var(--ok-soft);border-color:var(--ok)}.cdir.wrong{background:var(--bad-soft);border-color:var(--bad)}
.sit{grid-column:2;grid-row:2;background:var(--navy);color:#fff;border-radius:18px;padding:10px 10px 12px;text-align:center;width:100%}
.sit .faces{display:flex;justify-content:center;gap:2px;background:var(--navy-2);border-radius:12px;padding-top:4px;margin-bottom:8px}
.sit p{font:600 14.5px var(--body);line-height:1.3}
.timer{height:6px;border-radius:9px;background:#e3e8f1;overflow:hidden}.timer b{display:block;height:100%;background:var(--accent)}
.sample{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;text-align:center;min-height:44px}
.sample.ok{background:var(--ok-soft);border-color:var(--ok)}.sample.no{background:var(--bad-soft);border-color:var(--bad)}
.sample.wait{background:transparent;border-color:transparent;color:var(--muted);font-weight:600;font-size:13px}
/* rapor */
.score-big{font:700 64px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.status{font:700 14px var(--display);letter-spacing:.08em;border-radius:999px;padding:4px 14px;color:#fff}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:80px 1fr 52px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.row .bar{height:10px;border-radius:9px;background:#e3e8f1;overflow:hidden}.row .bar b{display:block;height:100%;background:var(--primary)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.insight{display:flex;flex-direction:column;gap:10px}
.ins{background:var(--navy);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ins b{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ins p{font:600 16px var(--display);line-height:1.3}
.ins span{font-size:13.5px;opacity:.85}
.league{position:relative;overflow:hidden;background:linear-gradient(160deg,#18213a 0%,#23305a 100%);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.league::before{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,71,.22),transparent 70%);pointer-events:none}
.lg-head{display:flex;gap:10px;align-items:center}.lg-head svg{width:36px;height:36px;flex:none}
.lg-head h3{color:#fff}.lg-head small{display:block;color:#aab4cc;font:600 12px var(--body)}
.league .tabs{background:rgba(255,255,255,.08)}.league .tabs button{color:#aab4cc}.league .tabs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.myrank{font:600 13px var(--body);color:#d6dcea;text-align:center}.myrank b{color:var(--accent)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px var(--display);color:var(--navy);background:#fff;border:3px solid var(--m);overflow:hidden}
.pod.g .ava{width:58px;height:58px}
.pod .ava svg{width:120%;height:auto;margin-top:22px}
.pod .pn{font:600 14px var(--display);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod .pc{font-size:11px;color:#aab4cc}
.pod .pv{font:700 19px var(--display);color:var(--m);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.pod .block{width:100%;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--m),rgba(255,255,255,.05));color:var(--navy);font:700 22px var(--display);display:flex;justify-content:center;padding-top:6px}
.pod.g{--m:#f5c542}.pod.s{--m:#c9d2e0}.pod.b{--m:#d6935c}
.pod.g .block{height:84px}.pod.s .block{height:60px}.pod.b .block{height:44px}
.you{font:700 10px var(--body);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 6px}
.pod .you{margin-top:4px}
.stand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stand li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.stand .rk{width:26px;height:26px;flex:none;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font:700 13px var(--display)}
.stand .nm{flex:1;min-width:0;font-weight:700;font-size:14px}.stand .nm small{display:block;font-weight:600;font-size:11.5px;color:#aab4cc}
.stand .sc{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.stand li.me{background:rgba(255,201,71,.16);box-shadow:inset 3px 0 0 var(--accent)}
.league .note{color:#8f9ab3}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td{padding:7px 6px;border-bottom:1px solid #edf0f5}
.lb td:first-child{width:28px;font-weight:700;color:var(--muted)}
.lb td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lb tr.me td{background:var(--accent-soft);font-weight:700}
.tabs{display:flex;gap:6px;background:#eef1f6;border-radius:12px;padding:4px}
.tabs button{flex:1;font:600 14px var(--display);border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(24,33,58,.12)}
.note{font-size:12px;color:var(--muted);text-align:center}
.inter{position:absolute;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.inter .k{font:700 13px var(--body);letter-spacing:.14em;color:var(--accent)}
.inter h2{font-size:30px}
/* arcade v2 */
.hud-r{display:flex;gap:8px;align-items:center}
.mute{font:600 11px var(--body);border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:4px 9px;cursor:pointer}
.lvl{font:600 13px var(--display);background:var(--navy);color:#fff;border-radius:99px;padding:3px 10px}
.lives i{background:none;width:22px;height:22px;display:inline-flex}.lives i svg{width:22px;height:22px;fill:var(--bad)}.lives i.off svg{fill:#d4dae5}
.hud2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.combo-m{display:inline-flex;align-items:center;gap:4px;font:600 14px var(--display);color:var(--muted)}
.combo-m svg{width:18px;height:18px;fill:#c3cad8;transition:fill .2s}
.combo-m.hot{color:#c2410c}.combo-m.hot svg{fill:#f97316}
.target b{color:var(--ink)}
.arena{border-radius:20px;overflow:hidden;min-height:400px}
.storebg{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.card{z-index:2;width:min(350px,94%)}
.card .bubble{font-size:19px}
.duo svg{max-width:118px}
.stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);font:700 22px var(--display);letter-spacing:.06em;padding:4px 14px;border:3px solid currentColor;border-radius:10px;background:rgba(255,255,255,.92);opacity:0;pointer-events:none;z-index:3}
.stamp.s-A{color:var(--ok)}.stamp.s-P{color:#5d6a84}.stamp.s-G{color:var(--bad)}
.card{border-width:2px;transition:transform .18s,border-color .25s}
.card.urgent{animation:urg .6s ease-in-out infinite alternate}
@keyframes urg{to{box-shadow:0 0 0 5px rgba(229,72,77,.18),0 10px 28px rgba(24,33,58,.10)}}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;background:var(--navy);color:#fff;font:600 14px var(--display);padding:6px 14px;border-radius:99px;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{animation:toast 1.6s ease}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-6px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{z-index:4}
.review{display:flex;flex-direction:column;gap:8px}
.rv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}

.pill.p-A{background:var(--ok)}.pill.p-P{background:#7d879b}.pill.p-G{background:var(--bad)}
/* babak 2-3 v2 */
.stepc{font:600 13px var(--display);background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:3px 10px;align-self:flex-start}

.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.sit.solo{grid-column:auto;grid-row:auto}
/* arcade v3: papan skor proporsional */
.scoreboard{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;gap:6px}

.gpill{font:700 11px var(--body);background:var(--navy);color:#fff;border-radius:6px;padding:3px 8px;flex:none}
.logo-pill{background:transparent;padding:0;display:inline-flex;align-items:center;flex:none}
.logo-pill:empty{display:none}
.logo-pill.lg{margin-bottom:6px}
.logo-sm{height:24px;width:auto;display:block}

.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:spin .9s linear infinite}

.chip{font:600 13px var(--body);background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-line);border-radius:12px;padding:8px 12px;text-align:center;line-height:1.4}

.credit .who{font:700 12.5px var(--body);letter-spacing:.02em;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{position:relative;z-index:6;flex:none;text-align:center;font:600 11px var(--body);letter-spacing:.06em;color:var(--muted);padding-block:6px max(6px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ MODE TEMPEL DI LMS ============
   Dibuka dari LMS: index.html?embed=1&nik=123456
   - NIK diisi otomatis dan langsung masuk (kolom NIK dikunci saat di dalam LMS).
   - Saat nilai tersimpan, LMS diberi kabar lewat postMessage.
     LMS tetap memeriksa sendiri sheet Rekap; kabar ini hanya pemicu. */
const QP=(()=>{try{return new URLSearchParams(location.search);}catch(e){return null;}})();
const EMBED=!!QP&&QP.get("embed")==="1"&&window.parent!==window;
let AUTO_NIK=QP?(QP.get("nik")||"").replace(/\D/g,""):"";
const NIK_LMS=AUTO_NIK;
const NIK_KUNCI=EMBED&&!!NIK_LMS;
function kabariLMS(ev,data){if(!EMBED)return;
  try{window.parent.postMessage(Object.assign({sumber:"game-ssl",modul:CONFIG.MODUL,event:ev},data||{}),"*");}catch(e){}}

/* ============ PENYIMPANAN DI HP ============ */
const LSK=k=>"ssl_"+CONFIG.MODUL+"_"+k;
const ls={get(k,d){try{const v=localStorage.getItem(LSK(k));return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(LSK(k));}catch(e){}}};

/* ============ KONEKSI KE APPS SCRIPT ============ */
async function api(aksi,data){
  if(DEMO)return new Promise(r=>setTimeout(()=>r(demoApi(aksi,data||{})),300));
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);let r;
  try{r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({aksi,modul:CONFIG.MODUL,nik:S.nik},data||{})),signal:ctl.signal,redirect:"follow"});}
  catch(e){const x=new Error("Tidak ada sinyal. Cek koneksi internet, lalu coba lagi.");x.net=true;throw x;}
  finally{clearTimeout(to);}
  let j;try{j=await r.json();}catch(e){const x=new Error("Server belum bisa dihubungi. Coba lagi sebentar.");x.net=true;throw x;}
  if(!j.ok){const x=new Error(j.pesan||"Terjadi kesalahan.");x.kode=j.err;throw x;}
  return j;}

/* Antrean kirim: data disimpan di HP dulu, dikirim saat ada sinyal. Aman dikirim ulang. */
const QRES={};let flushing=null;
function enqueue(it){it.t=Date.now();const q=ls.get("q",[]);const i=q.findIndex(x=>x.key===it.key);if(i>=0)q[i]=it;else q.push(it);ls.set("q",q);return flush();}
function flush(){if(flushing)return flushing;
  flushing=(async()=>{for(;;){const q=ls.get("q",[]);if(!q.length)break;const it=q[0];
      try{QRES[it.key]=await api(it.aksi,it.data);}
      catch(e){if(e.net||e.kode==="SIBUK"||e.kode==="SERVER")break;console.warn("Dibuang dari antrean:",it.key,e.message);}
      ls.set("q",ls.get("q",[]).filter(x=>!(x.key===it.key&&x.t===it.t)));}})()
    .finally(()=>{flushing=null;cekPending();});
  return flushing;}
/* Jika nilai yang tadinya tertunda sudah terkirim, rapor diperbarui */
function cekPending(){if(!S.pending||!S.sid)return;const r=QRES["s_"+S.sid];if(!r)return;
  S.pending=false;S.resmi=r.resmi;S.hasil=r.hasil;ls.del("sesi");kabariLMS("selesai",{status:r.status,total:r.total});const el=stage.querySelector(".pending");if(el)el.remove();}
window.addEventListener("online",()=>flush());

/* ============ MODE DEMO (tanpa sheet) ============ */
const DEMO_DB={n:0,resmi:null};
function demoApi(aksi,d){const tgl=new Date().toISOString().slice(0,10);
  if(aksi==="login")return{ok:true,peserta:{nama:"Peserta Demo",cabang:"Demo",tgl},resmi:DEMO_DB.resmi,percobaan:DEMO_DB.n,sesiTerbuka:null,rekorArcade:S.arcadeBest};
  if(aksi==="mulai"){DEMO_DB.n++;return{ok:true,lanjut:false,sesi:{id:"demo-"+DEMO_DB.n,status:DEMO_DB.n===1?"RESMI":"LATIHAN",percobaan:DEMO_DB.n,avatar:d.avatar,tahap:0,b:[0,0,0],ans:[]}};}
  if(aksi==="progres")return{ok:true};
  if(aksi==="selesai"){const t=d.b.reduce((a,x)=>a+x,0),h=t>=75?"LULUS":"REMEDIAL",r=d.id==="demo-1";if(r&&!DEMO_DB.resmi)DEMO_DB.resmi={total:t,hasil:h};
    return{ok:true,status:r?"RESMI":"LATIHAN",total:t,hasil:h,b:d.b,resmi:DEMO_DB.resmi};}
  if(aksi==="arcade")return{ok:true,rekor:Math.max(S.arcadeBest,d.skor)};
  if(aksi==="klasemen"){const mk=(vals,me)=>{const rows=NAMES.map((n,i)=>({nama:n[0],cabang:n[1],skor:vals[i]}));
      if(me!=null)rows.push({nama:"Kamu",cabang:"Demo",skor:me,saya:true});rows.sort((a,b)=>b.skor-a.skor||(a.saya?-1:1));
      const top=rows.slice(0,10).map((r,i)=>Object.assign({pos:i+1},r));const si=rows.findIndex(r=>r.saya);
      return{jumlah:rows.length,top,saya:si>=0?{pos:si+1,nama:"Kamu",cabang:"Demo",skor:rows[si].skor}:null};};
    return{ok:true,tgl,nilai:mk(SAMPLE,DEMO_DB.resmi?DEMO_DB.resmi.total:null),arcade:mk(ARC,S.arcadeBest||null)};}
  return{ok:false,err:"AKSI"};}

function scrLogin(){topbar(null);S.peserta=null;tampilIdentitas();let last="";try{last=localStorage.getItem("ssl_nik")||"";}catch(e){}
  if(NIK_KUNCI)last=NIK_LMS;else if(AUTO_NIK)last=AUTO_NIK;
  stage.innerHTML=`
  <div class="center grow" style="justify-content:center">
    <img class="logo-lg" src="${LOGO}" alt="Indomaret" onerror="this.remove()">
    <div class="face-md" style="display:flex">${face("sslp","senang")}${face("sslw","senang")}</div>
    <h1>360° Asertif</h1><p class="muted">Modul 1 · Game SSL</p>
    <div class="facts"><span>±12 menit</span><span>Pemanasan + 3 babak</span><span>Lulus ≥ 75</span></div>
    <div class="panel" style="width:100%;display:flex;flex-direction:column;gap:12px">
      <label for="nik" style="font-weight:700">Masukkan NIK kamu</label>
      <input id="nik" class="nik" inputmode="numeric" autocomplete="off" maxlength="${CONFIG.NIK_MAX}" placeholder="NIK" value="${esc(last)}"${NIK_KUNCI?" readonly":""}>
      <div class="fb" id="lfb"></div>
      <button class="btn y" id="go">Masuk</button>
    </div>
    ${DEMO?`<p class="note">Mode demo: belum tersambung ke sheet. NIK apa saja (minimal ${CONFIG.NIK_MIN} angka) diterima.</p>`:""}
  </div>`;
  const go=async()=>{const v=$("#nik").value.replace(/\D/g,"");
    if(v.length<CONFIG.NIK_MIN){$("#lfb").textContent=`NIK minimal ${CONFIG.NIK_MIN} angka.`;return;}
    const btn=$("#go");btn.disabled=true;btn.textContent="Memeriksa NIK…";$("#lfb").textContent="";
    S.nik=v;let j;
    try{j=await api("login");}catch(e){$("#lfb").textContent=e.message;btn.disabled=false;btn.textContent="Masuk";return;}
    try{localStorage.setItem("ssl_nik",v);}catch(e){}
    S.peserta=j.peserta;tampilIdentitas();S.resmi=j.resmi;S.riwayat=j.percobaan||0;S.arcadeBest=Math.max(S.arcadeBest,j.rekorArcade||0);
    if(j.resmi)kabariLMS("resmi-ada",{total:j.resmi.total});
    fullscreen();
    if(j.sesiTerbuka)scrLanjut(j.sesiTerbuka);else scrAvatar();};
  $("#go").onclick=go;$("#nik").onkeydown=e=>{if(e.key==="Enter")go();};
  if(AUTO_NIK){AUTO_NIK="";go();}}
const TAHAP_LBL=["Belum ada babak yang tersimpan","Babak 1 kasus 1","Babak 1","Babak 2"];
function scrLanjut(s){S.av=s.avatar==="W"?"sslw":"sslp";const nm=esc(S.peserta.nama);
  if(s.sisaLanjut>0){scrPesan(`Halo, ${nm}`,
    `Percobaan resmimu belum selesai. Tersimpan sampai: <b>${TAHAP_LBL[s.tahap]||"-"}</b>.<br>Kamu lanjut dari babak berikutnya, nilai yang sudah ada tetap aman.<br><span class="muted">Kesempatan lanjut tersisa: ${s.sisaLanjut}</span>`,
    "Lanjutkan",startAttempt,null,null,"netral");}
  else{scrPesan(`Halo, ${nm}`,
    `Percobaan resmimu sudah terputus beberapa kali dan kesempatan lanjut habis. Nilai resmi dihitung dari babak yang sudah selesai (${TAHAP_LBL[s.tahap]||"-"}).`,
    "Lihat nilai dan main latihan",startAttempt,null,null,"berpikir");}}
function scrAvatar(){topbar(null);const nm=S.peserta?esc(S.peserta.nama):"";stage.innerHTML=`
  <div class="center grow" style="justify-content:center">
    ${nm?`<h2>Halo, ${nm}!</h2>`:""}<h3>Pilih avatar kamu</h3><p class="muted">Tokoh-tokoh di game bakal manggil kamu sesuai pilihan ini.</p>
    <div class="av-pick"><button data-a="sslp" aria-pressed="${S.av==="sslp"}">${face("sslp","netral")}Pak</button><button data-a="sslw" aria-pressed="${S.av==="sslw"}">${face("sslw","netral")}Bu</button></div>
    ${S.resmi?`<div class="chip">Nilai resmimu ${S.resmi.total} (${S.resmi.hasil}). Main sekarang dicatat sebagai latihan.</div>`:""}
    <button class="btn y" id="ok">Mulai</button>
  </div>`;
  stage.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.av=b.dataset.a;stage.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#ok").onclick=()=>{const pertama=!S.resmi&&S.riwayat===0&&!S.warmDone;
    if(pertama)inter("PEMANASAN","Arcade Sikap",[[S.av,"senang"]],()=>rules("arcade",[[S.av,"senang"]],()=>arcade("warm")));
    else startAttempt();};}
/* Status RESMI/LATIHAN diminta ke server saat Babak 1 akan dimulai */
async function startAttempt(){clearTimers();topbar(null);stage.innerHTML=loading("Menyiapkan babak…");let j;
  try{j=await api("mulai",{avatar:avCode()});}
  catch(e){return scrPesan("Belum bisa mulai",esc(e.message),"Coba lagi",startAttempt,"Kembali",scrLogin);}
  if(j.ditutup)S.resmi={total:j.ditutup.total,hasil:j.ditutup.hasil};
  pakaiSesi(j.sesi);S.riwayat=Math.max(S.riwayat,S.percobaan);
  if(j.ditutup)return scrPesan("Percobaan resmi ditutup",`Nilai resmimu: <b>${j.ditutup.total}</b> (${j.ditutup.hasil}), dari babak yang sudah selesai. Sekarang kamu main sebagai latihan.`,"Mulai latihan",()=>keTahap(0));
  keTahap(S.tahap);}
function pakaiSesi(s){S.sid=s.id;S.status=s.status;S.percobaan=s.percobaan;S.av=s.avatar==="W"?"sslw":"sslp";
  S.b=(s.b||[0,0,0]).slice();S.ans=(s.ans||[]).slice();S.tahap=s.tahap||0;S.hasil=null;S.pending=false;
  const L=ls.get("sesi",null);if(L&&L.sid===s.id&&L.tahap>S.tahap){S.b=L.b;S.ans=L.ans;S.tahap=L.tahap;}
  simpanLokal();}
function simpanLokal(){ls.set("sesi",{sid:S.sid,nik:S.nik,tahap:S.tahap,b:S.b,ans:S.ans});}
function keTahap(t){if(t<=0)b1start(0);else if(t===1)b1start(1);else if(t===2)b2start();else if(t===3)b3start();else selesai();}
/* Titik simpan: 1 = Babak 1 kasus 1, 2 = Babak 1 selesai, 3 = Babak 2 selesai */
function checkpoint(t){S.tahap=t;simpanLokal();enqueue({key:"p_"+S.sid,aksi:"progres",data:{nik:S.nik,id:S.sid,tahap:t,b:S.b,ans:S.ans}});}
async function selesai(){clearTimers();topbar(null);stage.innerHTML=loading("Menyimpan nilai…");S.tahap=4;simpanLokal();
  const key="s_"+S.sid;await enqueue({key,aksi:"selesai",data:{nik:S.nik,id:S.sid,b:S.b,ans:S.ans,avatar:avCode()}});
  const r=QRES[key];
  if(r){S.resmi=r.resmi;S.hasil=r.hasil;S.pending=false;ls.del("sesi");kabariLMS("selesai",{status:r.status,total:r.total});}
  else{S.pending=true;S.hasil=null;if(S.status==="RESMI"&&!S.resmi)S.resmi={total:total(),hasil:total()>=75?"LULUS":"REMEDIAL"};}
  rapor();}

/* ============ SUARA ============ */
let AC=null,MUTE=true;try{const v=localStorage.getItem("mod01_mute");if(v!==null)MUTE=v==="1";}catch(e){}
function sfx(kind){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const seq={ok:[[660,.07],[880,.09]],bad:[[220,.16],[160,.2]],combo:[[660,.06],[880,.06],[1100,.1]],level:[[523,.08],[659,.08],[784,.08],[1047,.16]]}[kind]||[];
  let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==="bad"?"sawtooth":"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==="bad"?.06:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d;});}catch(e){}}
/* Membuka audio di dalam sentuhan/klik peserta. Browser (terutama saat game ditempel di LMS lewat iframe)
   hanya mengizinkan suara jika AudioContext dibuat/dilanjutkan di dalam gesture pengguna. */
function bukaSuara(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();
  const buf=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=buf;src.connect(AC.destination);src.start(0);}catch(e){}}
["pointerdown","touchend","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(!MUTE&&(!AC||AC.state!=="running"))bukaSuara();},{capture:true,passive:true}));
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>';
const FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>';
const STORE_BG=(()=>{const cols=["#cdd8f0","#efdcb4","#dccbea","#cde6d6","#f3cfcf"];let p="";
  for(let r=0;r<5;r++){const y=70+r*58;p+=`<rect x="0" y="${y+40}" width="400" height="5" fill="#c6d0e2"/>`;
    for(let k=0;k<22;k++){const h=18+((k*7+r*3)%3)*6,x=6+k*18;p+=`<rect x="${x}" y="${y+40-h}" width="14" height="${h}" rx="2" fill="${cols[(k+r*2)%5]}"/>`;}}
  for(let b=1;b<3;b++)p+=`<rect x="${b*133-3}" y="60" width="6" height="300" fill="#d3dbe9"/>`;
  let f="";for(let k=-6;k<=6;k++)f+=`<line x1="${200+k*40}" y1="380" x2="${200+k*110}" y2="600" stroke="#dbe2ee" stroke-width="2"/>`;
  return `<svg class="storebg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef7"/><stop offset="1" stop-color="#f3f6fb"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>
  <rect width="400" height="600" fill="url(#wall)"/><rect x="0" y="50" width="400" height="320" rx="0" fill="#e2e8f2"/>${p}
  <rect x="0" y="370" width="400" height="230" fill="#edf1f7"/>${f}<rect x="0" y="366" width="400" height="8" fill="#d7dfeb"/>
  <rect width="400" height="600" fill="url(#glow)"/></svg>`;})();
const SPK_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

/* ============ ARCADE ============ */
function arcade(mode){clearTimers();stage.scrollTop=0;topbar("Arcade Sikap",0);
  const A={score:0,lives:3,streak:0,right:0,level:1,limit:5,deck:rnd(BANK),i:0,lock:false,start:Date.now(),cardT:0,wrong:[]};
  const WARM=90,TOP=Math.max(...ARC);
  stage.innerHTML=`
   <div class="scoreboard">
     <div class="sb-cell"><span class="sb-l">Nyawa</span><div class="lives" id="lv"></div></div>
     <div class="sb-cell"><span class="sb-l">Level</span><b class="sb-v" id="lvl">1</b></div>
     <div class="sb-cell"><span class="sb-l">${mode==="warm"?"Waktu":"Mode"}</span><b class="sb-v" id="clock">${mode==="warm"?"90":"Bebas"}</b></div>
     <button class="mute" id="mute" aria-label="${MUTE?"Nyalakan suara":"Matikan suara"}">${MUTE?SPK_OFF:SPK_ON}</button></div>
   <div class="hud2"><span class="combo-m" id="cm">${FLAME}<b>Combo ×0</b></span><span class="target">Rekor <b>${S.arcadeBest}</b> · Top <b>${TOP}</b></span></div>
   <div class="arena" id="arena">${STORE_BG}<div class="toast" id="toast"></div><div class="pop" id="pop">+10</div></div>
   <div class="choice3"><button class="c-p" data-c="P">← Pasif</button><button class="c-a" data-c="A">↑ Asertif</button><button class="c-g" data-c="G">Agresif →</button></div>`;
  const lv=$("#lv"),arena=$("#arena");
  $("#mute").onclick=()=>{MUTE=!MUTE;try{localStorage.setItem("mod01_mute",MUTE?"1":"0")}catch(e){}if(!MUTE){bukaSuara();sfx("ok");}$("#mute").innerHTML=MUTE?SPK_OFF:SPK_ON;$("#mute").setAttribute("aria-label",MUTE?"Nyalakan suara":"Matikan suara");};
  const drawLives=()=>{lv.innerHTML=[0,1,2].map(i=>`<i class="${i<A.lives?"":"off"}">${HEART}</i>`).join("");};drawLives();
  const drawCombo=()=>{const c=$("#cm");c.querySelector("b").textContent="Combo ×"+A.streak;c.classList.toggle("hot",A.streak>=5);};
  function toast(t){const el=$("#toast");el.textContent=t;el.classList.remove("show");void el.offsetWidth;el.classList.add("show");}
  let card=null,raf=0;
  function bubble(c){const m=c[1].match(/^(.*\S)\s*\((padahal[^)]*)\)$/);if(m)return `<div class="bubble">${esc(m[1])}</div><div class="aside">dalam hati: ${esc(m[2])}</div>`;return `<div class="bubble ${/^\(/.test(c[1])?"act":""}">${esc(c[1])}</div>`;}
  function duo(c,a,b){const r=ROLE[c[3]];return `<div class="duo"><figure>${face(S.av,a)}<figcaption>Kamu</figcaption></figure><figure>${face(c[3],b)}<figcaption>${CH[c[3]].name}${r?" · "+r:""}</figcaption></figure></div>`;}
  function react(c){const k=c[2],w=c[3];return [{P:"lesu",A:"senang",G:"kesal"}[k],{P:"berpikir",A:"lega",G:(w==="sinta"||/^pel/.test(w))?"kesal":"tegang"}[k]];}
  function deal(){if(A.i>=A.deck.length){A.deck=rnd(BANK);A.i=0;}
    const c=A.deck[A.i++];A.cur=c;A.lock=false;
    if(card)card.remove();card=document.createElement("div");card.className="card";
    card.innerHTML=`<div class="stamp" id="stamp"></div><div class="dir">${c[0]}</div>${bubble(c)}${duo(c,"netral","netral")}<div class="tbar"><b></b></div>`;
    arena.appendChild(card);bindDrag(card);A.cardT=performance.now();loop();}
  function loop(){cancelAnimationFrame(raf);const tick=()=>{if(!card||A.lock)return;
      const el=(performance.now()-A.cardT)/1000,left=Math.max(0,1-el/A.limit);const b=card.querySelector(".tbar b");if(b)b.style.width=(left*100)+"%";
      card.style.borderColor=left>.5?"var(--line)":left>.25?"var(--accent)":"var(--bad)";card.classList.toggle("urgent",left<=.25);
      if(mode==="warm"){const rem=Math.max(0,WARM-Math.floor((Date.now()-A.start)/1000));$("#clock").textContent=rem;$("#clock").classList.toggle("low",rem<=10);if(rem<=0){end();return;}}
      if(left<=0){answer(null);return;}raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);timers.push(raf);}
  function answer(ch){if(A.lock)return;A.lock=true;cancelAnimationFrame(raf);const k=A.cur[2];card.classList.remove("urgent");card.style.borderColor="";
    const st=card.querySelector(".stamp");if(st)st.style.opacity="0";
    if(ch===k){A.streak++;A.right++;const g=10*(A.streak>5?2:1);A.score+=g;topbar("Arcade Sikap",A.score);drawCombo();
      const p=$("#pop");p.textContent="+"+g;p.classList.remove("show");void p.offsetWidth;p.classList.add("show");
      if(A.right%5===0){A.level++;A.limit=Math.max(2,A.limit-0.45);$("#lvl").textContent=A.level;toast(`Level ${A.level}! Makin cepat`);sfx("level");}
      else if(A.streak===5){toast("Combo ×2 aktif!");sfx("combo");}else sfx("ok");
      const rx=react(A.cur);card.style.transform="";card.querySelector(".duo").outerHTML=duo(A.cur,rx[0],rx[1]);
      const dx=ch==="P"?-420:ch==="G"?420:0,dy=ch==="A"?-520:0;
      timers.push(setTimeout(()=>{card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/20}deg)`;card.style.opacity="0";},550));
      timers.push(setTimeout(deal,780));}
    else{A.streak=0;drawCombo();A.lives--;drawLives();buzz(120);sfx("bad");A.wrong.push({c:A.cur,ch});card.classList.add("flip");card.style.transform="";
      const rx=react(A.cur);
      card.innerHTML=`<div class="dir">${ch?"Kurang tepat":"Waktu habis"}</div><div class="verdict" style="color:${k==="A"?"var(--ok)":k==="G"?"var(--bad)":"#5d6a84"}">Ini ${LBL[k]}</div>${bubble(A.cur)}${duo(A.cur,rx[0],rx[1])}`;
      timers.push(setTimeout(()=>{if(A.lives<=0)end();else deal();},1700));}}
  function bindDrag(el){let sx=0,sy=0,dx=0,dy=0,on=false;const stamp=el.querySelector(".stamp");
    el.onpointerdown=e=>{if(A.lock)return;on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;el.classList.add("drag");el.setPointerCapture(e.pointerId);};
    el.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${Math.min(dy,40)}px) rotate(${dx/18}deg)`;
      let d=null,m=0;if(-dy>Math.abs(dx)&&-dy>20){d="A";m=-dy;}else if(dx<-20){d="P";m=-dx;}else if(dx>20){d="G";m=dx;}
      if(d){stamp.textContent=LBL[d];stamp.className="stamp s-"+d;stamp.style.opacity=Math.min(1,m/90);}else stamp.style.opacity="0";};
    el.onpointerup=el.onpointercancel=()=>{if(!on)return;on=false;el.classList.remove("drag");
      if(dy<-70&&-dy>Math.abs(dx))answer("A");else if(dx<-70)answer("P");else if(dx>70)answer("G");else{el.style.transform="";stamp.style.opacity="0";}};}
  stage.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>answer(b.dataset.c));
  function end(){A.lock=true;cancelAnimationFrame(raf);clearTimers();S.arcadeRuns++;if(mode==="warm")S.warmDone=true;
    if(S.nik){const id=S.nik+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      enqueue({key:"a_"+id,aksi:"arcade",data:{nik:S.nik,idKirim:id,fase:mode==="warm"?"PEMANASAN":"BEBAS",skor:A.score,benar:A.right,level:A.level,durasi:Math.round((Date.now()-A.start)/1000)}});}
    const best=Math.max(S.arcadeBest,A.score),nb=A.score>S.arcadeBest&&A.score>0;S.arcadeBest=best;
    const why={P:"Pasif: memendam atau mengalah, masalahnya tidak selesai.",A:"Asertif: jujur dan jelas, tanpa menyerang orangnya.",G:"Agresif: menyerang orangnya, membentak, atau mengancam."};
    const rev=A.wrong.slice(-3).reverse();
    stage.innerHTML=`<div class="center">
      <div class="face-lg">${face(S.av,A.score>=150?"senang":"berpikir")}</div>
      <h2>${mode==="warm"?"Pemanasan selesai!":"Permainan selesai"}</h2>
      <div class="score-big">${A.score}</div>
      <p class="muted">${A.right} kartu benar · Level ${A.level} · Rekor kamu ${best}</p>
      ${nb?`<span class="you" style="font-size:12px;padding:4px 10px">REKOR BARU!</span>`:""}
      <p class="muted">Skor arcade tidak memengaruhi nilai.</p></div>
      ${rev.length?`<div class="review"><h3>Yang tadi kelewat</h3>${rev.map(w=>`<div class="rv"><p class="rv-t">${esc(w.c[1].replace(/\s*\((padahal[^)]*)\)$/," — dalam hati $1"))}</p>
        <p class="rv-a"><span class="pill p-${w.c[2]}">${LBL[w.c[2]]}</span>${w.ch?`<span class="muted">kamu jawab ${LBL[w.ch].toLowerCase()}</span>`:`<span class="muted">waktu habis</span>`}</p>
        <p class="rv-w">${why[w.c[2]]}</p></div>`).join("")}</div>`:`<div class="tip">Mantap, nggak ada yang salah!</div>`}
      ${mode==="warm"?`<button class="btn y" id="nx">Lanjut ke Babak 1</button>`:`<button class="btn y" id="again">Main lagi</button><button class="btn ghost" id="back">Kembali ke rapor</button>`}`;
    stage.scrollTop=0;
    if(mode==="warm")$("#nx").onclick=startAttempt;else{$("#again").onclick=()=>arcade("free");$("#back").onclick=rapor;}}
  deal();}

function rules(key,chars,next){clearTimers();const R=RULES[key];topbar(null);stage.scrollTop=0;
  stage.innerHTML=`<div class="center"><div class="k-eyebrow">${R.k}</div><h2>${R.t}</h2>
     <div class="face-md" style="display:flex;gap:2px">${chars.map(c=>face(c[0],c[1])).join("")}</div></div>
   <div class="panel"><h3 style="margin-bottom:10px">Cara main</h3><ol class="howto">${R.items.map(t=>`<li>${t}</li>`).join("")}</ol></div>
   <p class="note" style="font-weight:700">${R.max}</p>
   <button class="btn y" id="mulai">Mulai</button>`;
  $("#mulai").onclick=next;}

/* ============ BABAK 1 ============ */
function b1start(ci){ci=ci||0;inter("BABAK 1","Menegur",[["andi","netral"],["riko","netral"]],()=>rules("b1",[["andi","netral"],["riko","netral"]],()=>b1(ci)));}
function b1(ci){clearTimers();stage.scrollTop=0;const C=CASES[ci];const slots=[null,null,null,null,null];let checked=false;
  const pieces=rnd([...C.steps.map((t,i)=>({t,k:i})),...C.traps.map((x,i)=>({t:x.t,trap:i}))]);
  const placed=i=>slots.includes(i);
  function render(){const full=slots.every(x=>x!==null),next=slots.indexOf(null);
    topbar("Babak 1 · Menegur",S.b[0]);
    stage.innerHTML=`<h3>${C.title}</h3>
     <div class="scene"><div class="face-sm" id="fc">${face(C.who,"netral")}</div><div class="say">${C.scene}</div></div>
     <div class="board"><div class="lbl">Susunan teguranmu</div><div class="slots">${STEPN.map((n,i)=>{const pi=slots[i];return `<button class="slot ${pi!==null?"taken":i===next?"next":""}" data-s="${i}" ${pi===null?"disabled":""}><b>${i+1}. ${n}</b><span>${pi!==null?esc(pieces[pi].t):i===next?"Isi di sini":""}</span></button>`;}).join("")}</div></div>
     ${full?`<div class="lbl c">Udah lengkap? Tekan Periksa. Mau ganti? Ketuk slotnya.</div>`:`<div class="lbl">Ketuk kalimat yang pas buat slot kuning</div>`}
     ${full?`<button class="btn y" id="cek">Periksa</button>`:""}
     <div class="pieces">${pieces.map((p,i)=>placed(i)?"":`<button class="piece" data-i="${i}">${esc(p.t)}</button>`).join("")}</div>
`;
    stage.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{const n=slots.indexOf(null);if(n<0)return;slots[n]=+b.dataset.i;render();});
    stage.querySelectorAll(".slot[data-s]").forEach(b=>b.onclick=()=>{const s=+b.dataset.s;if(slots[s]===null)return;slots[s]=null;render();});
    const ck=$("#cek");if(ck)ck.onclick=check;}
  function check(){if(checked)return;checked=true;let ok=0;const log=[],fbs=[];
    const res=slots.map((pi,i)=>{const p=pieces[pi];if(p.k===i){ok++;log.push("B");return true;}
      if(p.trap!=null){log.push("J");fbs.push(C.traps[p.trap].fb);}else log.push("S");return false;});
    const score=ok*3;S.b[0]+=score;S.ans.push(`B1K${ci+1}:${score}:${log.join("")}`);checkpoint(ci===0?1:2);
    const e=ok>=4?"lega":ok>=2?"netral":"tegang";if(ok<5)buzz(120);
    topbar("Babak 1 · Menegur",S.b[0]);
    stage.innerHTML=`<h3>${C.title}</h3>
     <div class="scene"><div class="face-sm">${face(C.who,e)}</div><div class="say">${ok===5?"Teguran lengkap dan runtut.":`${ok} dari 5 langkah tepat.`}</div></div>
     <div class="meter"><span>Kepercayaan</span><div class="bar"><div class="fill" style="width:${ok*20}%;background:${ok>=4?"var(--ok)":ok>=2?"var(--accent)":"var(--bad)"}"></div></div></div>
     <div class="board"><div class="lbl">Hasil teguranmu</div><div class="slots">${STEPN.map((n,i)=>`<div class="slot ${res[i]?"fill":"bad"}"><b>${i+1}. ${n}</b><span>${esc(pieces[slots[i]].t)}${res[i]?"":`<em>Seharusnya: ${esc(C.steps[i])}</em>`}</span></div>`).join("")}</div></div>
     ${[...new Set(fbs)].map(f=>`<div class="tip">${f}</div>`).join("")}
     <div class="fb ${ok>=4?"good":""}">+${score} poin</div>
     <button class="btn y" id="nx">${ci===0?"Lanjut ke kasus 2":"Lanjut ke Babak 2"}</button>`;
    $("#nx").onclick=()=>{if(ci===0)b1(1);else b2start();};}
  render();}

/* ============ BABAK 2 ============ */
function b2start(){inter("BABAK 2","Serah terima dengan Bu Sinta",[["sinta","netral"]],()=>rules("b2",[["sinta","netral"]],b2));}
function b2(){clearTimers();stage.scrollTop=0;let cred=50,step=0,score=0,ch="h";const st={},res=[],picks=[];
  topbar("Babak 2 · Serah terima",S.b[0]);
  stage.innerHTML=`<div class="chat-head"><div class="face-sm" id="sf">${face("sinta","netral")}</div><div class="who"><b>Bu Sinta</b> <span class="muted" id="via"></span><div class="meter"><span>Kredibilitas</span><div class="bar"><div class="fill" id="cr" style="width:${cred}%"></div></div></div></div><span class="stepc" id="stc">1/6</span></div>
   <div class="chat" id="chat"><div class="bub sys">Target naik. Dua anggota tim sakit. Shift jadi timpang.</div></div>
   <div id="tip"></div><div class="opts" id="opts"></div>`;
  const chat=$("#chat"),opts=$("#opts");
  const add=(cls,html)=>{const d=document.createElement("div");d.className="bub "+cls;d.innerHTML=html;chat.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"});};
  const say=t=>esc(t.replace(/\{s\}/g,sapa()));
  function ask(){const T=B2T[step];$("#tip").innerHTML="";$("#stc").textContent=(step+1)+"/6";
    if(step===1&&ch==="k"){add("act","Saat serah terima, Bu Sinta menghampiri kamu.");add("her",say("Tadi mau bicara apa, {s}?"));}
    opts.innerHTML=`<div class="center" style="gap:2px"><h3>${T.q(ch,st)}</h3><div class="lbl">Ketuk satu jawaban</div></div>`+
      rnd(T.opts).map(o=>`<button class="opt" data-id="${o.id}">${esc(o.t(ch,st))}</button>`).join("");
    opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(T,T.opts.find(o=>o.id===b.dataset.id)));
    opts.scrollIntoView({behavior:"smooth",block:"end"});}
  function pick(T,o){opts.innerHTML="";picks.push(o.id+o.p);res.push(o.p===T.max);score+=o.p;S.b[1]=score;topbar("Babak 2 · Serah terima",total());
    if(step===0){ch=o.id;add("act",esc(o.act));$("#via").textContent=ch==="w"?"· WhatsApp":"· bertemu langsung";}
    else add("me",esc(o.t(ch,st))+(o.att?`<div class="att"><span>Jadwal shift</span><span>Data transaksi</span></div>`:""));
    const reply=o.r(ch,st);st[T.key]=o.id;
    cred=Math.max(5,Math.min(100,cred+(o.p===T.max?12:o.p>0?0:-15)));
    timers.push(setTimeout(()=>{$("#sf").innerHTML=face("sinta",o.e);$("#cr").style.width=cred+"%";add("her",say(reply));
      if(o.p<T.max){$("#tip").innerHTML=`<div class="tip">${T.tip}</div>`;if(o.p===0)buzz(120);}
      step++;
      if(step<B2T.length)timers.push(setTimeout(ask,o.p<T.max?1900:900));
      else timers.push(setTimeout(finish,1100));},700));}
  function finish(){S.ans.push(`B2:${picks.join(",")}`);$("#tip").innerHTML="";
    const good=[],fix=[];B2T.forEach(T=>{const id=st[T.key],o=T.opts.find(x=>x.id===id),txt=B2C[T.key][id];const line=typeof txt==="function"?txt(st):txt;(o.p===T.max?good:fix).push(line);});
    const fin=st.sanggah==="a"?["ok","Usulanmu disetujui Bu Sinta."]:st.sanggah==="p"?["mid","Keputusannya ditunda."]:["no","Belum ada keputusan, masalahnya masih menggantung."];
    const head=score>=30?"Kamu menyampaikan masalah ke atasan dengan asertif.":score>=20?"Sudah ke arah yang benar, tapi masih ada bagian yang bisa diperkuat.":"Pesannya belum sampai dengan utuh ke Bu Sinta.";
    opts.innerHTML=`<div class="concl"><div class="cc-k">Kesimpulan obrolan</div><p class="cc-h">${head}</p>
       <div class="cc-res ${fin[0]}">Hasilnya: ${fin[1]}</div>
       ${good.length?`<div class="cc-sub ok">Yang sudah pas</div><ul>${good.map(g=>`<li>${g}</li>`).join("")}</ul>`:""}
       ${fix.length?`<div class="cc-sub no">Yang bisa diperbaiki</div><ul>${fix.map(g=>`<li>${g}</li>`).join("")}</ul>`:""}
       <div class="cc-score">Babak 2: <b>${score}</b> dari 35 poin</div></div><button class="btn y" id="nx">Lanjut ke Babak 3</button>`;
    checkpoint(3);
    $("#nx").onclick=b3start;opts.scrollIntoView({behavior:"smooth",block:"end"});}
  timers.push(setTimeout(ask,600));}

/* ============ BABAK 3 ============ */
function b3start(){inter("BABAK 3","Kompas Situasi",[[S.av,"berpikir"]],()=>rules("b3",[[S.av,"berpikir"]],b3));}
function order(){let o;do{o=rnd(SITS);}while(o.some((s,i)=>i>0&&s.g===o[i-1].g));return o;}
function b3(){clearTimers();const list=order();const wrongB3=[];let i=0,right=0,streak=0,raf=0,lock=false;const log=[];const LIM=12;const N=list.length;
  const pts=()=>Math.round(right*35/N);
  function show(){const s=list[i];lock=false;stage.scrollTop=0;topbar("Babak 3 · Kompas",S.b[0]+S.b[1]+pts());
    stage.innerHTML=`<div class="hud"><span>Situasi ${i+1} dari ${N}</span><span class="combo-m ${streak>=3?"hot":""}">${FLAME}<b>×${streak}</b></span><span id="sec">${LIM}</span></div><div class="timer"><b id="tb" style="width:100%"></b></div>
     <div class="lbl c">Ketuk gaya yang paling cocok buat situasi ini</div>
     <div class="compass">${["n","e","s","w"].map(d=>`<button class="cdir ${d}" data-d="${d}"><svg viewBox="0 0 24 24">${DIRS[d].i}</svg>${DIRS[d].l}</button>`).join("")}
      <div class="sit"><div class="faces ${s.who.length>1?"face-sm":"face-md"}">${s.who.map(w=>face(w[0],w[1])).join("")}</div><p>${s.t}</p></div></div>
     <div class="sample wait" id="smp">Contoh kalimatnya muncul setelah kamu jawab</div>`;
    stage.querySelectorAll(".cdir").forEach(b=>b.onclick=()=>ans(b.dataset.d));
    const t0=performance.now();const tick=()=>{if(lock)return;const el=(performance.now()-t0)/1000,left=Math.max(0,LIM-el);
      $("#tb").style.width=(left/LIM*100)+"%";$("#sec").textContent=Math.ceil(left);if(left<=0){ans(null);return;}raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);}
  function ans(d){if(lock)return;lock=true;cancelAnimationFrame(raf);const s=list[i],ok=d===s.k;
    stage.querySelectorAll(".cdir").forEach(b=>{b.disabled=true;if(b.dataset.d===s.k)b.classList.add("right");else if(b.dataset.d===d)b.classList.add("wrong");});
    const smp=$("#smp");
    if(ok){right++;streak++;log.push(s.id+"B");sfx(streak%3===0?"combo":"ok");smp.className="sample ok";smp.innerHTML=`Tepat! ${s.ex}`;}
    else{streak=0;wrongB3.push(s);log.push(s.id+(d?"S":"H"));buzz(120);sfx("bad");smp.className="sample no";smp.innerHTML=`${d?"":"Waktu habis. "}${s.bad}<br><span style="font-weight:600">${s.ex}</span>`;
      const f=stage.querySelector(".sit .faces");if(f&&s.who.length===1)f.innerHTML=face(s.who[0][0],s.k==="e"?"tegang":"kesal");}
    topbar("Babak 3 · Kompas",S.b[0]+S.b[1]+pts());
    timers.push(setTimeout(()=>{i++;if(i<N)show();else{S.b[2]=pts();S.b3wrong=wrongB3;S.ans.push(`B3:${log.join(",")}`);selesai();}},ok?1700:2800));}
  show();}

/* ============ RAPOR ============ */
const BADGE='<svg class="badge" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 40 14 60l10-5 6 8 4-21z" fill="#e2463d"/><path d="M44 40l6 20-10-5-6 8-4-21z" fill="#2f6fd0"/><circle cx="32" cy="28" r="22" fill="#f5c542"/><circle cx="32" cy="28" r="17" fill="#ffe08a" stroke="#d9a92c" stroke-width="2"/><path d="M24 29l6 6 11-13" stroke="#8a6500" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NAMES=[["Dewi A.","Bekasi"],["Rudi H.","Cikarang"],["Sari P.","Bogor"],["Agus W.","Tangerang"],["Maya K.","Depok"],["Hendra S.","Bekasi"],["Lina R.","Bogor"],["Fajar N.","Cikarang"],["Tono B.","Depok"]];
const SAMPLE=[96,91,88,84,80,77,72,66,58];const ARC=[420,380,350,300,260,240,210,170,120];
function focusHTML(){const pc=[S.b[0]/30,S.b[1]/35,S.b[2]/35];const w=pc.indexOf(Math.min(...pc));if(pc[w]>=1)return "";
  const tip=["Babak 1 · Menegur: ingat urutan Privat → Fakta → Dampak → Tanya → Harapan.","Babak 2 · Ke atasan: datang dengan data, dampak, dan usulan.","Babak 3 · Situasi: cocokkan gaya dengan situasinya."][w];
  const wr=(S.b3wrong||[]).slice(0,3);
  return `<div class="focus"><div class="cc-k">Fokus perbaikanmu</div><p>${tip}</p>${wr.length?`<div class="cc-sub no">Situasi yang tadi kelewat</div>${wr.map(x=>`<div class="fw"><span>${x.t}</span><span class="gpill">${DIRS[x.k].l}</span></div>`).join("")}`:""}</div>`;}
function boardHTML(k,label){if(!k||!k.top||!k.top.length)return `<p class="myrank">Belum ada data untuk tanggal training ini.</p><p class="note">${label}</p>`;
  const ini=r=>r.saya?face(S.av,"senang"):esc(String(r.nama).split(" ").map(w=>w[0]).join("").slice(0,2));
  const pod=[1,0,2].filter(i=>k.top[i]).map(i=>{const r=k.top[i];return `<div class="pod ${["g","s","b"][i]}" style="grid-column:${[2,1,3][i]}"><div class="ava">${ini(r)}</div><div class="pn">${esc(r.nama)}</div><div class="pc">${esc(r.cabang)}</div>${r.saya?'<span class="you">KAMU</span>':""}<div class="pv">${r.skor}</div><div class="block">${r.pos}</div></div>`;}).join("");
  const li=r=>`<li class="${r.saya?"me":""}"><span class="rk">${r.pos}</span><span class="nm">${esc(r.nama)}<small>${esc(r.cabang)}</small></span>${r.saya?'<span class="you">KAMU</span>':""}<span class="sc">${r.skor}</span></li>`;
  let rest=k.top.slice(3).map(li).join("");
  if(k.saya&&!k.top.some(r=>r.saya))rest+=`<li class="gap">···</li>`+li(Object.assign({saya:true},k.saya));
  return `<p class="myrank">${k.saya?`Posisi kamu: <b>#${k.saya.pos}</b> dari ${k.jumlah} peserta`:`Kamu belum masuk klasemen ini · ${k.jumlah} peserta`}</p><div class="podium">${pod}</div>${rest?`<ol class="stand">${rest}</ol>`:""}<p class="note">${label}</p>`;}
let KL=null,KTAB="n";
async function muatKlasemen(){const el=$("#lb");if(!el)return;el.innerHTML=`<p class="myrank">Memuat klasemen…</p>`;
  try{KL=await api("klasemen");gambarKlasemen();}
  catch(e){if(!$("#lb"))return;$("#lb").innerHTML=`<p class="myrank">${esc(e.message)}</p><button class="btn ghost" id="klr" style="margin-top:8px">Muat ulang klasemen</button>`;$("#klr").onclick=muatKlasemen;}}
function gambarKlasemen(){const el=$("#lb");if(!el||!KL)return;
  el.innerHTML=KTAB==="n"?boardHTML(KL.nilai,(DEMO?"Contoh data (mode demo). ":"")+"Nilai resmi peserta dengan tanggal training yang sama."):boardHTML(KL.arcade,"Rekor arcade tertinggi tiap orang. Tidak memengaruhi nilai.");}
function rapor(){clearTimers();const t=total();
  const lulus=S.hasil?S.hasil==="LULUS":t>=75,latihan=S.status==="LATIHAN";
  const badgeOn=(S.resmi&&S.resmi.hasil==="LULUS")||(!latihan&&lulus);
  topbar(latihan?"Rapor latihan":"Rapor MOD-01",t);
  stage.innerHTML=`
   <div class="center"><img class="logo-md" src="${LOGO}" alt="Indomaret" onerror="this.remove()"><div class="face-lg">${face(S.av,lulus?"senang":"berpikir")}</div>
    <div class="score-big">${t}</div><span class="status" style="background:${lulus?"var(--ok)":"var(--bad)"}">${lulus?"LULUS":"REMEDIAL"}</span>
    <p class="muted">${latihan?`Ini latihan (percobaan ke-${S.percobaan}). Nilai resmimu tetap ${S.resmi?S.resmi.total:"–"}.`:lulus?"Selamat, kamu dapat badge Asertif!":"Batas lulus 75. Pelajari kartu di bawah, lalu coba latihan."}</p>
    ${S.pending?`<div class="pending">Nilai sudah tersimpan di HP ini dan akan terkirim otomatis saat ada sinyal. Jangan hapus data browser.</div>`:""}</div>
   <div class="badge-row ${badgeOn?"":"locked"}">${BADGE}<div><b>Badge Asertif</b><span>${badgeOn?"Terbuka · Modul 1 dari 5":"Terkunci · butuh nilai 75"}</span></div></div>
   ${focusHTML()}
   <div class="panel rows">
    ${[["Babak 1",S.b[0],30],["Babak 2",S.b[1],35],["Babak 3",S.b[2],35]].map(r=>`<div class="row"><span>${r[0]}</span><div class="bar"><b style="width:${r[1]/r[2]*100}%"></b></div><span>${r[1]}/${r[2]}</span></div>`).join("")}
   </div>
   <h3>Kartu insight</h3>
   <div class="insight">
    <div class="ins"><b>Menegur bawahan</b><p>Privat → Fakta → Dampak → Tanya → Harapan</p><span>Tegur perilakunya, bukan orangnya.</span></div>
    <div class="ins"><b>Ke atasan</b><p>Momen tepat → Data → Situasi → Dampak → Usul solusi</p><span>Saat serah terima, bukan saat CIF sibuk.</span></div>
    <div class="ins"><b>Kompas situasi</b><p>Darurat: tegas · Coaching: hangat · Rapat: data · Konflik: netral</p><span>Asertif bukan satu nada untuk semua.</span></div>
   </div>
   <div class="league">
    <div class="lg-head"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M10 5h16v8a8 8 0 0 1-16 0z" fill="#f5c542"/><path d="M10 8H5v3a5 5 0 0 0 5 5M26 8h5v3a5 5 0 0 1-5 5" stroke="#f5c542" stroke-width="2.4" fill="none"/><path d="M16 21h4v5h-4z" fill="#d9a92c"/><rect x="11" y="26" width="14" height="5" rx="1.5" fill="#f5c542"/></svg><div><h3>Klasemen Batch</h3><small>Training ${S.peserta?esc(S.peserta.tgl):"hari ini"}</small></div></div>
    <div class="tabs"><button aria-pressed="${KTAB==="n"}" data-tb="n">Nilai resmi</button><button aria-pressed="${KTAB==="a"}" data-tb="a">Rekor arcade</button></div>
    <div id="lb"></div>
   </div>
   <button class="btn y" id="arc">Main Arcade Sikap</button>
   <button class="btn ghost" id="rep">Main lagi 3 babak (latihan)</button>
`;
  stage.scrollTop=0;
  stage.querySelectorAll("[data-tb]").forEach(b=>b.onclick=()=>{KTAB=b.dataset.tb;stage.querySelectorAll("[data-tb]").forEach(x=>x.setAttribute("aria-pressed",x===b));gambarKlasemen();});
  $("#arc").onclick=()=>arcade("free");$("#rep").onclick=()=>startAttempt();
  muatKlasemen();
  if(S.pending)flush();}

document.querySelectorAll("img[data-logo]").forEach(i=>i.src=LOGO);scrLogin();
if(!DEMO)flush();
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
})();
</script>
