<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memberikan Apresiasi MOD-02</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#18213a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: aplikasi satu layar, kolom tunggal maks 480px. Konten tampil di panel lembut/gelap, pilihan selalu kartu putih bergaris tepi */
:root{
  --navy:#18213a; --navy-2:#24304f; --ink:#18213a; --muted:#68738a; --line:#dde3ee;
  --bg:#f5f7fb; --page:#e8ecf4; --white:#ffffff;
  --primary:#2d5be3; --primary-soft:#edf1fd; --primary-line:#b9c8f4;
  --accent:#ffc947; --accent-soft:#fff6dc; --accent-ink:#4a3600;
  --ok:#17a057; --ok-soft:#e6f6ec; --bad:#e5484d; --bad-soft:#fdeced;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--navy);color:#fff;min-height:50px}
.top .ttl{font-family:var(--display);font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pts{font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.tag-latihan{font:700 11px var(--body);letter-spacing:.06em;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:3px 7px}
.stripe{height:4px;background:linear-gradient(90deg,#2f6fd0 0 64%,#f2c230 64% 76%,#e2463d 76% 100%)}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-block:16px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
#stage>*{flex-shrink:0}
#stage>.grow{flex-shrink:1}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;font-weight:700} h2{font-size:24px;font-weight:600} h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.lbl{font:700 13px var(--body);color:var(--muted)}
.lbl.c{text-align:center}
/* tombol aksi: gelap; pilihan jawaban: putih bergaris tepi */
.btn{font:600 17px var(--display);letter-spacing:.01em;border:0;border-radius:14px;padding:14px 18px;background:var(--navy);color:#fff;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--navy);color:#fff}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.grow{flex:1}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.panel{background:var(--white);border-radius:18px;padding:16px;border:1px solid var(--line)}
input.nik{font:600 24px var(--display);letter-spacing:.08em;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;width:100%;background:#fff;color:var(--ink)}
input.nik:focus{border-color:var(--primary);outline:none}
.av-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.av-pick button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 6px 12px;cursor:pointer;font:600 17px var(--display);color:var(--ink)}
.av-pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.av-pick svg{width:100%;height:auto;display:block}
.face-lg svg{width:150px;height:auto}
.face-md svg{width:96px;height:auto}
.face-sm svg{width:64px;height:auto}
.fb{min-height:22px;font-weight:700;font-size:15px;color:var(--bad);text-align:center}
.fb.good{color:var(--ok)}
.k-eyebrow{font:700 12px var(--body);letter-spacing:.12em;color:var(--primary)}
.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:10px}
.howto li{counter-increment:h;display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.4}
.howto li::before{content:counter(h);flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font:700 13px var(--display);display:flex;align-items:center;justify-content:center}
.tip{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--accent-ink);text-align:center}
/* rapor */
.score-big{font:700 64px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.status{font:700 14px var(--display);letter-spacing:.08em;border-radius:999px;padding:4px 14px;color:#fff}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:80px 1fr 52px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.row .bar{height:10px;border-radius:9px;background:#e3e8f1;overflow:hidden}.row .bar b{display:block;height:100%;background:var(--primary)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.insight{display:flex;flex-direction:column;gap:10px}
.ins{background:var(--navy);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ins b{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ins p{font:600 16px var(--display);line-height:1.3}
.ins span{font-size:13.5px;opacity:.85}
.league{position:relative;overflow:hidden;background:linear-gradient(160deg,#18213a 0%,#23305a 100%);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.league::before{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,71,.22),transparent 70%);pointer-events:none}
.lg-head{display:flex;gap:10px;align-items:center}.lg-head svg{width:36px;height:36px;flex:none}
.lg-head h3{color:#fff}.lg-head small{display:block;color:#aab4cc;font:600 12px var(--body)}
.league .tabs{background:rgba(255,255,255,.08)}.league .tabs button{color:#aab4cc}.league .tabs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.myrank{font:600 13px var(--body);color:#d6dcea;text-align:center}.myrank b{color:var(--accent)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px var(--display);color:var(--navy);background:#fff;border:3px solid var(--m);overflow:hidden}
.pod.g .ava{width:58px;height:58px}
.pod .ava svg{width:120%;height:auto;margin-top:22px}
.pod .pn{font:600 14px var(--display);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod .pc{font-size:11px;color:#aab4cc}
.pod .pv{font:700 19px var(--display);color:var(--m);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.pod .block{width:100%;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--m),rgba(255,255,255,.05));color:var(--navy);font:700 22px var(--display);display:flex;justify-content:center;padding-top:6px}
.pod.g{--m:#f5c542}.pod.s{--m:#c9d2e0}.pod.b{--m:#d6935c}
.pod.g .block{height:84px}.pod.s .block{height:60px}.pod.b .block{height:44px}
.you{font:700 10px var(--body);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 6px}
.pod .you{margin-top:4px}
.stand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stand li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.stand .rk{width:26px;height:26px;flex:none;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font:700 13px var(--display)}
.stand .nm{flex:1;min-width:0;font-weight:700;font-size:14px}.stand .nm small{display:block;font-weight:600;font-size:11.5px;color:#aab4cc}
.stand .sc{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.stand li.me{background:rgba(255,201,71,.16);box-shadow:inset 3px 0 0 var(--accent)}
.league .note{color:#8f9ab3}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td{padding:7px 6px;border-bottom:1px solid #edf0f5}
.lb td:first-child{width:28px;font-weight:700;color:var(--muted)}
.lb td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lb tr.me td{background:var(--accent-soft);font-weight:700}
.tabs{display:flex;gap:6px;background:#eef1f6;border-radius:12px;padding:4px}
.tabs button{flex:1;font:600 14px var(--display);border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(24,33,58,.12)}
.note{font-size:12px;color:var(--muted);text-align:center}
.inter{position:absolute;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.inter .k{font:700 13px var(--body);letter-spacing:.14em;color:var(--accent)}
.inter h2{font-size:30px}
.concl{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.cc-k{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.cc-h{font:600 18px var(--display);line-height:1.3}
.cc-res{font-weight:700;font-size:14px;border-radius:10px;padding:8px 12px}
.cc-res.ok{background:var(--ok-soft);color:#0f6b3a}.cc-res.mid{background:var(--accent-soft);color:var(--accent-ink)}.cc-res.no{background:var(--bad-soft);color:#a32a2e}
.cc-sub{font:700 13px var(--body);margin-top:4px}.cc-sub.ok{color:var(--ok)}.cc-sub.no{color:var(--bad)}
.concl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.4}
.cc-score{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}.cc-score b{color:var(--ink)}
.aside{font:600 13px var(--body);color:var(--muted);font-style:italic;margin-top:-4px}
.facts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.facts span{font:600 13px var(--body);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink)}
.badge-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.badge-row .badge{width:56px;height:56px;flex:none}
.badge-row b{display:block;font:600 17px var(--display)}.badge-row span{font-size:13px;color:var(--muted)}
.badge-row.locked .badge{filter:grayscale(1);opacity:.45}
.focus{background:var(--accent-soft);border:1px solid #f3dc9a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.focus p{font-weight:600;font-size:14.5px;line-height:1.4}
.fw{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}
.gpill{font:700 11px var(--body);background:var(--navy);color:#fff;border-radius:6px;padding:3px 8px;flex:none}
.logo-pill{background:transparent;padding:0;display:inline-flex;align-items:center;flex:none}
.logo-pill:empty{display:none}
.logo-pill.lg{margin-bottom:6px}
.logo-sm{height:24px;width:auto;display:block}
.logo-md{height:30px;width:auto;display:block}
.logo-lg{height:46px;width:auto;display:block;margin-bottom:4px}
.stand li.gap{background:none;justify-content:center;color:#8f9ab3;padding:0;font-weight:700;letter-spacing:.2em}
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;color:var(--muted);font-weight:600}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{font:600 13px var(--body);background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-line);border-radius:12px;padding:8px 12px;text-align:center;line-height:1.4}
.chip.warn{background:var(--accent-soft);color:var(--accent-ink);border-color:#f3dc9a}
.pending{font:600 12.5px var(--body);background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:8px 12px;text-align:center}
.credit .who{font:700 12.5px var(--body);letter-spacing:.02em;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{position:relative;z-index:6;flex:none;text-align:center;font:600 11px var(--body);letter-spacing:.06em;color:var(--muted);padding-block:6px max(6px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.credit{padding-inline:84px}
.snd{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;gap:6px}
.snd button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.snd button svg{width:18px;height:18px}.snd button.off{color:var(--muted);opacity:.55}.snd button:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== MOD-02: tambahan global ===== */
:root{--floor:#eef2f8;--shelf:#d3dbe9;--k0:#8da2c4;--k1:#7cc4a0;--k2:#3fae6e;--k3:#1f8a52;--k4:#e5484d;
  --cs:#2d5be3;--cs-soft:#e8eefe;--cb:#17a057;--cb-soft:#e3f5ea;--ci:#e8760c;--ci-soft:#fff0df}
.howto li span{min-width:0}
.lgx{display:flex;flex-direction:column;gap:8px}
.lgx-r{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px;line-height:1.35}
.lgx-r i{flex:none;width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px var(--display);font-style:normal}
.lgx-r.S i{background:var(--cs)}.lgx-r.B i{background:var(--cb)}.lgx-r.I i{background:var(--ci)}

:root{--s:#2d5be3;--s-soft:#e8eefe;--p:#17a057;--p-soft:#e3f5ea;--d:#e8760c;--d-soft:#fff0df}
/* ===== gaya per babak: hanya berlaku saat #app memakai kelas g1/g2/g3/gw ===== */
#app.g1 .lbl,#app.g2 .lbl,#app.gw .lbl{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#app.g1 .hud,#app.g2 .hud,#app.gw .hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:8px 12px}
#app.g1 .hcell,#app.g2 .hcell,#app.gw .hcell{display:flex;flex-direction:column;align-items:center;gap:1px}
#app.g1 .hcell b,#app.g2 .hcell b,#app.gw .hcell b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
#app.g1 .hcell b.low,#app.g2 .hcell b.low,#app.gw .hcell b.low{color:var(--bad)}
#app.g1 .smile,#app.g2 .smile,#app.gw .smile{display:flex;flex-direction:column;gap:4px;min-width:0}
#app.g1 .smile .bar,#app.g2 .smile .bar,#app.gw .smile .bar{height:10px;border-radius:99px;background:#e3e8f1;overflow:hidden}
#app.g1 .smile .bar i,#app.g2 .smile .bar i,#app.gw .smile .bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s,background .4s}
#app.g1 .map,#app.g2 .map,#app.gw .map{position:relative;height:min(62vh,400px);min-height:330px;border-radius:20px;overflow:hidden;background:var(--floor);border:1px solid var(--line);touch-action:manipulation}
#app.g1 .zone,#app.g2 .zone,#app.gw .zone{position:absolute;background:var(--shelf);border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 9.5px var(--body);letter-spacing:.08em;color:#5d6a84}
#app.g1 .zone.k,#app.g2 .zone.k,#app.gw .zone.k{background:#cfe0f7}
#app.g1 .zone.g,#app.g2 .zone.g,#app.gw .zone.g{background:#e3dccf}
#app.g1 .zone.p,#app.g2 .zone.p,#app.gw .zone.p{background:transparent;border:2px dashed #b9c3d6}
#app.g1 .st,#app.g2 .st,#app.gw .st{position:absolute;width:112px;margin-left:-56px;margin-top:-34px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;transition:left 2.2s ease-in-out,top 2.2s ease-in-out;z-index:2}
#app.g1 .st .hd,#app.g2 .st .hd,#app.gw .st .hd{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--white);border:2.5px solid var(--white);box-shadow:0 2px 6px rgba(24,33,58,.18)}
#app.g1 .st .hd svg,#app.g2 .st .hd svg,#app.gw .st .hd svg{width:122%;margin:-3px 0 0 -11%}
#app.g1 .st .act,#app.g2 .st .act,#app.gw .st .act{font:700 10.5px/1.25 var(--body);background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 6px;max-width:112px;text-align:center;min-height:16px}
#app.g1 .st .nm,#app.g2 .st .nm,#app.gw .st .nm{font:700 10px var(--body);color:var(--muted)}
#app.g1 .st.hit .hd,#app.g2 .st.hit .hd,#app.gw .st.hit .hd{border-color:var(--bad)}
#app.g1 .st.fade .act,#app.g2 .st.fade .act,#app.gw .st.fade .act{opacity:.35}
#app.g1 .st.done .hd,#app.g2 .st.done .hd,#app.gw .st.done .hd{border-color:var(--ok)}
#app.g1 .toast,#app.g2 .toast,#app.gw .toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--navy);color:var(--white);font:600 13px var(--display);padding:6px 12px;border-radius:99px;white-space:nowrap;opacity:0;pointer-events:none;z-index:5;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#app.g1 .toast.show,#app.g2 .toast.show,#app.gw .toast.show{animation:toast 1.8s ease}
#app.g1 .sheet,#app.g2 .sheet,#app.gw .sheet{position:absolute;inset:0;background:rgba(24,33,58,.55);display:flex;align-items:flex-end;z-index:6}
#app.g1 .sheet .card,#app.g2 .sheet .card,#app.gw .sheet .card{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
#app.g1 .steps,#app.g2 .steps,#app.gw .steps{display:flex;gap:6px}
#app.g1 .steps i,#app.g2 .steps i,#app.gw .steps i{flex:1;height:5px;border-radius:9px;background:#dde3ee}
#app.g1 .steps i.on,#app.g2 .steps i.on,#app.gw .steps i.on{background:var(--primary)}
#app.g1 .steps i.dn,#app.g2 .steps i.dn,#app.gw .steps i.dn{background:var(--ok)}
#app.g1 .scene,#app.g2 .scene,#app.gw .scene{display:flex;gap:10px;align-items:center;background:var(--navy);color:var(--white);border-radius:16px;padding:10px 12px}
#app.g1 .scene .face-sm,#app.g2 .scene .face-sm,#app.gw .scene .face-sm{background:var(--navy-2);border-radius:12px;flex:none}

<script>
(function(){
"use strict";
/* ============================================================
   CONFIG — isi bagian ini saja
   ============================================================ */
const CONFIG={
  // URL Web App Apps Script (berakhiran /exec). Kosong = MODE DEMO, tidak tersambung ke sheet.
  API_URL:"https://script.google.com/macros/s/AKfycbzJ5ZNeKVKlYYv9DMgHHS1dZz20i6OuUJK0_wVZ9RPPd4UFeEUdEHg2JPcWUZgYHSem/exec",
  // Kode modul, harus sama dengan CONFIG.MODUL di Apps Script
  MODUL:"MOD02",
  // Panjang NIK yang diterima di layar masuk
  NIK_MIN:5, NIK_MAX:16
};
const DEMO=!CONFIG.API_URL;

/* ============ MODE TEMPEL DI LMS ============
   Dibuka dari LMS: index.html?embed=1&nik=123456
   - NIK diisi otomatis dan langsung masuk (kolom NIK dikunci saat di dalam LMS).
   - Saat nilai tersimpan, LMS diberi kabar lewat postMessage.
     LMS tetap memeriksa sendiri sheet Rekap; kabar ini hanya pemicu. */
const QP=(()=>{try{return new URLSearchParams(location.search);}catch(e){return null;}})();
const EMBED=!!QP&&QP.get("embed")==="1"&&window.parent!==window;
let AUTO_NIK=QP?(QP.get("nik")||"").replace(/\D/g,""):"";
const NIK_LMS=AUTO_NIK;
const NIK_KUNCI=EMBED&&!!NIK_LMS;
function kabariLMS(ev,data){if(!EMBED)return;
  try{window.parent.postMessage(Object.assign({sumber:"game-ssl",modul:CONFIG.MODUL,event:ev},data||{}),"*");}catch(e){}}

/* ============ PENYIMPANAN DI HP ============ */
const LSK=k=>"ssl_"+CONFIG.MODUL+"_"+k;
const ls={get(k,d){try{const v=localStorage.getItem(LSK(k));return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(LSK(k));}catch(e){}}};

/* ============ KONEKSI KE APPS SCRIPT ============ */
async function api(aksi,data){
  if(DEMO)return new Promise(r=>setTimeout(()=>r(demoApi(aksi,data||{})),300));
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);let r;
  try{r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({aksi,modul:CONFIG.MODUL,nik:S.nik},data||{})),signal:ctl.signal,redirect:"follow"});}
  catch(e){const x=new Error("Tidak ada sinyal. Cek koneksi internet, lalu coba lagi.");x.net=true;throw x;}
  finally{clearTimeout(to);}
  let j;try{j=await r.json();}catch(e){const x=new Error("Server belum bisa dihubungi. Coba lagi sebentar.");x.net=true;throw x;}
  if(!j.ok){const x=new Error(j.pesan||"Terjadi kesalahan.");x.kode=j.err;throw x;}
  return j;}

/* Antrean kirim: data disimpan di HP dulu, dikirim saat ada sinyal. Aman dikirim ulang. */
const QRES={};let flushing=null;
function enqueue(it){it.t=Date.now();const q=ls.get("q",[]);const i=q.findIndex(x=>x.key===it.key);if(i>=0)q[i]=it;else q.push(it);ls.set("q",q);return flush();}
function flush(){if(flushing)return flushing;
  flushing=(async()=>{for(;;){const q=ls.get("q",[]);if(!q.length)break;const it=q[0];
      try{QRES[it.key]=await api(it.aksi,it.data);}
      catch(e){if(e.net||e.kode==="SIBUK"||e.kode==="SERVER")break;console.warn("Dibuang dari antrean:",it.key,e.message);}
      ls.set("q",ls.get("q",[]).filter(x=>!(x.key===it.key&&x.t===it.t)));}})()
    .finally(()=>{flushing=null;cekPending();});
  return flushing;}
/* Jika nilai yang tadinya tertunda sudah terkirim, rapor diperbarui */
function cekPending(){if(!S.pending||!S.sid)return;const r=QRES["s_"+S.sid];if(!r)return;
  S.pending=false;S.resmi=r.resmi;S.hasil=r.hasil;ls.del("sesi");kabariLMS("selesai",{status:r.status,total:r.total});const el=stage.querySelector(".pending");if(el)el.remove();}
window.addEventListener("online",()=>flush());

/* ============ MODE DEMO (tanpa sheet) ============ */
const DEMO_DB={n:0,resmi:null};
function demoApi(aksi,d){const tgl=new Date().toISOString().slice(0,10);
  if(aksi==="login")return{ok:true,peserta:{nama:"Peserta Demo",cabang:"Demo",tgl},resmi:DEMO_DB.resmi,percobaan:DEMO_DB.n,sesiTerbuka:null,rekorArcade:S.arcadeBest};
  if(aksi==="mulai"){DEMO_DB.n++;return{ok:true,lanjut:false,sesi:{id:"demo-"+DEMO_DB.n,status:DEMO_DB.n===1?"RESMI":"LATIHAN",percobaan:DEMO_DB.n,avatar:d.avatar,tahap:0,b:[0,0,0],ans:[]}};}
  if(aksi==="progres")return{ok:true};
  if(aksi==="selesai"){const t=d.b.reduce((a,x)=>a+x,0),h=t>=75?"LULUS":"REMEDIAL",r=d.id==="demo-1";if(r&&!DEMO_DB.resmi)DEMO_DB.resmi={total:t,hasil:h};

function pakaiSesi(s){S.sid=s.id;S.status=s.status;S.percobaan=s.percobaan;S.av=s.avatar==="W"?"sslw":"sslp";

async function selesai(){clearTimers();topbar(null);stage.innerHTML=loading("Menyimpan nilai…");S.tahap=4;simpanLokal();

/* ============ SUARA ============
   Semua suara dibuat langsung oleh browser (Web Audio), tanpa file MP3.
   Dua saklar di pojok kanan bawah (footer):
     Speaker = semua suara (efek + musik). Musik = musik latar saja.
   Pilihan peserta tersimpan di HP. Bawaan saat pertama kali dibuka: lihat SUARA_AWAL. */
const SUARA_AWAL={efek:true,musik:true};
let AC=null,MASTER=null,SFXB=null,BGMB=null,NOISE=null;
let MUTE=!SUARA_AWAL.efek,MUSIK=SUARA_AWAL.musik;
try{const v=localStorage.getItem("mod02_mute");if(v!==null)MUTE=v==="1";
  const m=localStorage.getItem("mod02_musik");if(m!==null)MUSIK=m==="1";}catch(e){}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function siapkanJalur(){if(!AC||MASTER)return;
  MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(AC.destination);
  SFXB=AC.createGain();SFXB.gain.value=1;SFXB.connect(MASTER);
  BGMB=AC.createGain();BGMB.gain.value=.55;BGMB.connect(MASTER);}
/* Satu nada. o: w=bentuk gelombang, v=volume, a=attack, ke=meluncur ke frekuensi, bus */
function nada(f,t,d,o){o=o||{};try{const g=AC.createGain(),osc=AC.createOscillator();osc.type=o.w||"triangle";
  osc.frequency.setValueAtTime(f,t);if(o.ke)osc.frequency.exponentialRampToValueAtTime(o.ke,t+d);
  const v=o.v||.1,a=Math.min(o.a||.005,d*.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g).connect(o.bus||SFXB);osc.start(t);osc.stop(t+d+.03);}catch(e){}}
/* Desis (noise) tersaring: untuk whoosh, kartu, kertas, hi-hat */
function desis(t,d,o){o=o||{};try{if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;
  f.type=o.ft||"bandpass";f.frequency.setValueAtTime(o.f||2000,t);if(o.fe)f.frequency.exponentialRampToValueAtTime(o.fe,t+d);f.Q.value=o.q||1;
  const v=o.v||.05;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(o.a||.01,d*.5));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(o.bus||SFXB);s.start(t);s.stop(t+d+.03);}catch(e){}}
function kilau(t){[1568,1976,2349,2637,3136].forEach((f,i)=>nada(f,t+i*.05,.28,{w:"sine",v:.04}));}
const arp=(t,fs,gap,d,o)=>fs.forEach((f,i)=>nada(f,t+i*gap,d,o));

  tap:t=>nada(1500,t,.04,{w:"sine",v:.045}),                                   // tombol umum

  bad:t=>{nada(220,t,.18,{w:"sawtooth",v:.05,ke:150});nada(165,t+.1,.22,{w:"sawtooth",v:.045,ke:110});},

  msgIn:t=>{nada(880,t,.06,{w:"sine",v:.09,ke:1320});nada(1320,t+.06,.08,{w:"sine",v:.05});},  // B2: chat masuk
  msgOut:t=>{desis(t,.12,{f:1800,fe:4000,v:.03,ft:"highpass"});nada(700,t,.09,{w:"sine",v:.06,ke:1050});}, // B2: chat terkirim
  note:t=>nada(520,t,.25,{w:"sine",v:.05}),                                    // narasi/aksi
  tick:t=>nada(1250,t,.04,{w:"square",v:.03}),                                 // hitung mundur

  gameover:t=>arp(t,[523,466,392,330],.14,.26,{v:.09}),
  record:t=>{arp(t,[523,659,784,1047,1319],.08,.2,{v:.1});kilau(t+.45);},
  fanfare:t=>{arp(t,[392,523,659],.12,.2,{v:.1});[523,659,784,1047].forEach(f=>nada(f,t+.4,1.1,{v:.055,a:.03}));kilau(t+.9);},
  gentle:t=>{nada(523,t,.3,{w:"sine",v:.08});nada(659,t+.18,.32,{w:"sine",v:.08});nada(587,t+.4,.55,{w:"sine",v:.07});},
  badge:t=>kilau(t),
  mid:t=>{nada(587,t,.14,{w:"sine",v:.08});nada(523,t+.12,.2,{w:"sine",v:.07});},   // jawaban kurang pas
  grab:t=>nada(700,t,.06,{w:"sine",v:.05,ke:900}),                                  // keping/kartu diangkat
  spark:t=>{nada(990,t,.1,{w:"sine",v:.06});nada(1320,t+.08,.14,{w:"sine",v:.05});},// B1: momen emas muncul
  pump:t=>nada(380,t,.05,{w:"square",v:.025,ke:520}),                               // B3: kadar naik satu tingkat
  trash:t=>{desis(t,.14,{f:600,fe:200,v:.05});nada(300,t,.12,{w:"sine",v:.05,ke:160});} // B2: pengecoh dibuang
};
/* Motif pembuka tiap babak */
const JINGLE={"PEMANASAN":[784,988,1175],"BABAK 1":[523,659,784],"BABAK 2":[587,740,880],"BABAK 3":[659,831,988]};
function jingle(k){if(MUTE||!AC||AC.state!=="running")return;const fs=JINGLE[k]||[523,659,784],t=AC.currentTime+.01;
  arp(t,fs,.11,.18,{v:.1});fs.forEach(f=>nada(f*2,t+.36,.6,{v:.04,a:.02}));}

function sfx(kind){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();siapkanJalur();
  if(AC.state==="suspended")AC.resume();const f=SFX[kind];if(f)f(AC.currentTime+.01);}catch(e){}}
/* Membuka audio di dalam sentuhan/klik peserta. Browser (terutama saat game ditempel di LMS lewat iframe)
   hanya mengizinkan suara jika AudioContext dibuat/dilanjutkan di dalam gesture pengguna. */
function bukaSuara(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();siapkanJalur();if(AC.state!=="running")AC.resume();
  const buf=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=buf;src.connect(AC.destination);src.start(0);}catch(e){}}
["pointerdown","touchend","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(!MUTE&&(!AC||AC.state!=="running"))bukaSuara();},{capture:true,passive:true}));

/* ---- Musik latar: pola per suasana, diputar ulang terus ----
   ch = progresi akor (nada MIDI), arp = urutan nada akor per ketukan (3 = oktaf atas, -1 = jeda) */
const LAGU={
  menu:  {bpm:88, ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],arp:[0,1,2,1,3,2,1,2],arpV:.03, pad:.022,bass:[0,4],bassV:.045},
  chat:  {bpm:84, ch:[[60,64,67],[53,57,60],[57,60,64],[55,59,62]],arp:[0,-1,-1,2,-1,-1,1,-1],arpV:.028,pad:.026,bass:[0],bassV:.04},
  babak: {bpm:100,ch:[[53,57,60],[55,59,62],[52,55,59],[57,60,64]],arp:[0,2,1,2,3,2,1,2],arpV:.03, pad:.018,bass:[0,3,4],bassV:.045,hat:[2,6],hatV:.012},
  kompas:{bpm:124,ch:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]],arp:[0,1,2,1,0,1,2,3],arpV:.024,pad:.01, bass:[0,1,2,3,4,5,6,7],bassV:.03,hat:[1,3,5,7],hatV:.012},
  arcade:{bpm:132,ch:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],arp:[0,1,2,3,2,1,2,1],arpV:.028,pad:0,  bass:[0,2,4,6],bassV:.045,bassOct:[0,12,0,12],hat:[1,3,5,7],hatV:.014,kick:[0,4]}
};
const BGM={mode:null,step:0,next:0};
function musik(m){if(BGM.mode===m)return;BGM.mode=m;BGM.step=0;BGM.next=AC?AC.currentTime+.08:0;}
function musikNanti(m,ms){setTimeout(()=>{if(BGM.mode===null)musik(m);},ms);}
function langkah(L,step,t,sd){const s=step%8,ch=L.ch[Math.floor(step/8)%L.ch.length];
  if(s===0&&L.pad)ch.forEach(n=>nada(mtof(n),t,sd*8*.95,{v:L.pad,a:.25,bus:BGMB}));
  const ai=L.arp[s];if(ai>=0)nada(mtof((ai===3?ch[0]+12:ch[ai])+12),t,sd*.9,{v:L.arpV,bus:BGMB});
  const bi=L.bass.indexOf(s);if(bi>=0)nada(mtof(ch[0]-12+(L.bassOct?L.bassOct[bi]:0)),t,sd*.9,{v:L.bassV,bus:BGMB});
  if(L.hat&&L.hat.includes(s))desis(t,.04,{f:8000,ft:"highpass",v:L.hatV,bus:BGMB});
  if(L.kick&&L.kick.includes(s))nada(150,t,.12,{w:"sine",v:.09,ke:50,bus:BGMB});}
setInterval(()=>{if(MUTE||!MUSIK||!BGM.mode||!AC||AC.state!=="running"||document.hidden)return;
  const L=LAGU[BGM.mode];if(!L)return;siapkanJalur();const sd=60/L.bpm/2;
  if(BGM.next<AC.currentTime)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.2){langkah(L,BGM.step,BGM.next,sd);BGM.step=(BGM.step+1)%(8*L.ch.length);BGM.next+=sd;}},60);

/* ============ ARCADE · TANGKAP SBI ============
   Pola sama dengan Arcade Sikap MOD-01: 3 nyawa, level, combo, rekor; pemanasan 90 detik sekali,
   mode Bebas dari rapor. Skor dikirim lewat aksi "arcade" (fase PEMANASAN / BEBAS). */
const WARM=90,TOP=Math.max(...[420,380,350,300,260,240,210,170,120]);let raf=0;
/* ============ DATA · TANGKAP SBI (⚠ semua kalimat karangan, cek trainer) ============ */
const CATS={S:{n:"Situation",id:"Situasi",why:"Situation (Situasi): kapan dan di mana kejadiannya."},B:{n:"Behavior",id:"Perilaku",why:"Behavior (Perilaku): tindakan yang terlihat dan bisa dicatat."},I:{n:"Impact",id:"Dampak",why:"Impact (Dampak): akibat nyata dari tindakan itu."}};
const lab=k=>`${CATS[k].n} (${CATS[k].id})`;
const ORDER=["S","B","I"];
const BANK={
 S:["Tadi pagi toko sedang ramai di jam sibuk.","Kemarin sore barang datang dari DC dalam jumlah banyak.","Siang tadi antrean di kasir 2 mengular panjang.","Seorang pelanggan marah soal harga label di kasir.","Pagi ini toko belum buka dan rak masih berantakan.","Minggu lalu stok opname akhir bulan sedang berjalan.","Tadi malam hujan deras dan toko sepi pelanggan.","Sabtu kemarin promo besar baru saja dimulai."],
 B:["Kamu tetap tenang dan mendengarkan sampai selesai.","Kode expired kamu tata menghadap ke depan.","Kamu langsung membuka kasir sebelah tanpa disuruh.","Ibu itu kamu antar sampai ke kendaraannya.","Label harga kamu cek ulang satu per satu.","Setiap pelanggan yang masuk kamu sapa sambil tersenyum.","Selisih stok langsung kamu catat dan laporkan.","Rak snack kamu rapikan sebelum jam buka."],
 I:["Antrean jadi cepat terurai dan pelanggan puas.","Tim mudah mencari barang saat mengisi rak.","Pelanggan reda dan mau kembali berbelanja.","Toko bisa buka tepat waktu tanpa terburu-buru.","Selisih stok bisa dilacak sebelum jadi kerugian.","Rekan satu shift jadi lebih tenang dan terbantu.","Pelanggan merasa dihargai dan memuji toko kita.","Display rapi dan pelanggan pertama merasa nyaman."]};
const rndA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* Dek seimbang: tiap putaran berisi satu S, satu B, satu I dalam urutan acak */
function makeDeck(){const q={S:rndA(BANK.S),B:rndA(BANK.B),I:rndA(BANK.I)},d=[];for(let i=0;i<8;i++)rndA(ORDER).forEach(k=>d.push([k,q[k][i]]));return d;}


function arcade(mode){clearTimers();cancelAnimationFrame(raf);stage.scrollTop=0;topbar("Tangkap SBI",0);
  const A={score:0,lives:3,streak:0,bestStreak:0,right:0,level:1,limit:6.5,t:0,ct:0,lock:true,over:false,ready:.7,deck:makeDeck(),i:0,cur:null,dx:0,wrong:[],lastRem:0,dragging:false};
  stage.innerHTML=`
   <div class="scoreboard">
     <div class="sb-cell"><span class="sb-l">Nyawa</span><div class="lives" id="lv"></div></div>
     <div class="sb-cell"><span class="sb-l">Level</span><b class="sb-v" id="lvl">1</b></div>
     <div class="sb-cell"><span class="sb-l">${mode==="warm"?"Waktu":"Mode"}</span><b class="sb-v" id="clock">${mode==="warm"?WARM:"Bebas"}</b></div>
     <button class="mute" id="mute" type="button" aria-label="Suara">${MUTE?SPK_OFF:SPK_ON}</button></div>
   <div class="hud2"><span class="combo-m" id="cm">${FLAME}<b>Combo ×0</b></span><span class="target">Rekor <b>${S.arcadeBest}</b> · Top <b>${TOP}</b></span></div>
   <div class="arena cat" id="arena"><div class="toast" id="toast"></div><div class="sp" id="sp">+10</div><div class="hint3" id="hint3">Seret kalimat ke keranjang, atau ketuk keranjangnya</div>
    <div class="baskets" id="bks">${ORDER.map(k=>`<button class="bk ${k}" type="button" data-k="${k}"><b>${k}</b><span>${CATS[k].n}<em>(${CATS[k].id})</em></span></button>`).join("")}</div></div>`;
  const arena=$("#arena"),lv=$("#lv");
  const drawLives=()=>{lv.innerHTML=[0,1,2].map(i=>`<i class="${i<A.lives?"":"off"}">${HEART}</i>`).join("");};drawLives();
  const drawCombo=()=>{const c=$("#cm");c.querySelector("b").textContent="Combo ×"+A.streak;c.classList.toggle("hot",A.streak>=5);};
  $("#mute").onclick=()=>setMute(!MUTE);
  const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.remove("show");void el.offsetWidth;el.classList.add("show");};
  const pop=t=>{const p=$("#sp");p.textContent=t;p.classList.remove("show");void p.offsetWidth;p.classList.add("show");};
  const bk=k=>document.querySelector(`.bk.${k}`);
  const dims=()=>({W:arena.clientWidth,H:arena.clientHeight});
  let card=null,y0=8,y1=200,ch=80;
  function measure(){const {H}=dims();ch=card?card.offsetHeight:80;y0=8;y1=H-88-ch-6;}
  window.addEventListener("resize",measure);
  function deal(){if(A.over)return;if(A.i>=A.deck.length){A.deck=makeDeck();A.i=0;}
    const c=A.deck[A.i++];A.cur=c;A.ct=0;A.dx=0;A.lock=false;
    if(card)card.remove();card=document.createElement("div");card.className="fcard";
    card.innerHTML=`<div class="dir">Kalimat apresiasi</div><div class="tx">${esc(c[1])}</div>`;arena.appendChild(card);
    measure();bindDrag(card);
    document.querySelectorAll(".bk").forEach(b=>b.classList.remove("ok","bad","want","over"));sfx("deal");place(0);const h=$("#hint3");if(h)h.hidden=A.i>3;}
  function place(prog){const y=y0+(y1-y0)*Math.min(1,prog);card.style.top=y+"px";card.style.marginLeft=`calc(-37% + ${A.dx}px)`;
    card.classList.toggle("urgent",prog>.75);}
  const colX=k=>{const {W}=dims();return W*(ORDER.indexOf(k)+.5)/3;};
  function answer(k){if(A.lock||A.over||!A.cur)return;A.lock=true;const c=A.cur,ok=k===c[0];
    if(ok){A.streak++;A.right++;A.bestStreak=Math.max(A.bestStreak,A.streak);const g=10*(A.streak>5?2:1);A.score+=g;topbar("Tangkap SBI",A.score);drawCombo();pop("+"+g);
      const {W}=dims();card.style.transition="top .22s ease-in,margin-left .22s ease-in,opacity .22s";card.style.top=(y1+ch*.15)+"px";card.style.marginLeft=`calc(-37% + ${colX(k)-W/2}px)`;card.style.opacity="0";
      bk(k).classList.add("ok");
      if(A.right%5===0){A.level++;A.limit=Math.max(3,A.limit-.5);$("#lvl").textContent=A.level;toast("Level "+A.level+"! Makin cepat");sfx("level");}
      else if(A.streak===5){toast("Combo ×2 aktif!");sfx("combo");}else sfx("ok");
      setTimeout(deal,560);return;}
    A.streak=0;drawCombo();A.lives--;drawLives();buzz(120);sfx("bad");A.wrong.push({c,k});
    if(k)bk(k).classList.add("bad");bk(c[0]).classList.add("want");
    const col={S:"var(--cs)",B:"var(--cb)",I:"var(--ci)"}[c[0]],{H}=dims();
    card.classList.add("flip");card.style.transition="top .25s ease-out,margin-left .25s";card.style.top=Math.max(8,(H-88-ch)/2-30)+"px";card.style.marginLeft="-37%";
    card.innerHTML=`<div class="dir">${k?"Kurang tepat":"Waktu habis"}</div><div class="vd" style="color:${col}">Ini ${lab(c[0])}</div><div class="tx small">${esc(c[1])}</div><p class="why">${esc(CATS[c[0]].why)}</p>`;
    setTimeout(()=>{if(A.lives<=0)end();else deal();},2100);}
  function bindDrag(el){let sx=0,on=false,moved=false;
    el.onpointerdown=e=>{if(A.lock)return;on=true;moved=false;sx=e.clientX-A.dx;el.setPointerCapture(e.pointerId);};
    el.onpointermove=e=>{if(!on)return;{const W=dims().W,m=W*.3;A.dx=Math.max(-m,Math.min(m,e.clientX-sx));}if(Math.abs(A.dx)>12)moved=true;A.dragging=true;
      const {W}=dims();const k=ORDER[Math.max(0,Math.min(2,Math.floor((W/2+A.dx)/(W/3))))];document.querySelectorAll(".bk").forEach(b=>b.classList.toggle("over",moved&&b.dataset.k===k));};
    el.onpointerup=el.onpointercancel=e=>{if(!on)return;on=false;A.dragging=false;document.querySelectorAll(".bk").forEach(b=>b.classList.remove("over"));
      if(moved){const {W}=dims();answer(ORDER[Math.max(0,Math.min(2,Math.floor((W/2+A.dx)/(W/3))))]);}else A.dx=0;};}
  document.querySelectorAll(".bk").forEach(b=>b.onclick=()=>answer(b.dataset.k));
  let last=performance.now();
  const loop=now=>{if(A.over)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(A.ready>0){A.ready-=dt;if(A.ready<=0)deal();}
    else{A.t+=dt;
      if(mode==="warm"){const rem=Math.max(0,WARM-Math.floor(A.t));if(rem!==A.lastRem){A.lastRem=rem;$("#clock").textContent=rem;$("#clock").classList.toggle("low",rem<=10);if(rem<=5&&rem>0)sfx("tick");}if(rem<=0){end();return;}}
      if(!A.lock&&card){A.ct+=dt;place(A.ct/A.limit);if(A.ct>=A.limit)answer(null);}}
    raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);
  function end(){if(A.over)return;A.over=true;A.lock=true;cancelAnimationFrame(raf);
    window.removeEventListener("resize",measure);S.arcadeRuns++;if(mode==="warm")S.warmDone=true;
    if(S.nik){const id=S.nik+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      enqueue({key:"a_"+id,aksi:"arcade",data:{nik:S.nik,idKirim:id,fase:mode==="warm"?"PEMANASAN":"BEBAS",skor:A.score,benar:A.right,level:A.level,durasi:Math.round(A.t)}});}
    const best=Math.max(S.arcadeBest,A.score),nb=A.score>S.arcadeBest&&A.score>0;S.arcadeBest=best;musik(null);sfx(nb?"record":"gameover");musikNanti("menu",2500);
    const rev=A.wrong.slice(-3).reverse();
    stage.innerHTML=`<div class="center">
      <div class="face-lg">${face(S.av,A.score>=150?"senang":"berpikir")}</div>
      <h2>${mode==="warm"?"Pemanasan selesai!":"Permainan selesai"}</h2>
      <div class="score-big">${A.score}</div>
      <p class="muted">${A.right} kalimat benar · Combo terbaik ${A.bestStreak} · Level ${A.level} · Rekor kamu ${best}</p>
      ${nb?`<span class="you">REKOR BARU!</span>`:""}
      <p class="muted">Skor arcade tidak memengaruhi nilai.</p></div>
      ${rev.length?`<div class="review"><h3>Yang tadi kelewat</h3>${rev.map(w=>`<div class="rv"><p class="t">${esc(w.c[1])}</p>
        <p class="a"><span class="pill ${w.c[0]}">${w.c[0]} · ${lab(w.c[0])}</span>${w.k?`<span>kamu pilih ${w.k} · ${lab(w.k)}</span>`:`<span>waktu habis</span>`}</p><p class="w">${esc(CATS[w.c[0]].why)}</p></div>`).join("")}</div>`:`<div class="tip">Mantap, tidak ada yang salah!</div>`}
      ${mode==="warm"?`<button class="btn y" id="nx">Lanjut ke Babak 1</button>`:`<button class="btn y" id="again">Main lagi</button><button class="btn ghost" id="back">Kembali ke rapor</button>`}`;
    stage.scrollTop=0;
    if(mode==="warm")$("#nx").onclick=startAttempt;else{$("#again").onclick=()=>arcade("free");$("#back").onclick=rapor;}}}

/* ============ BABAK 1-3 ============

function b1start(){S.b=[0,0,0];S.ans=[];inter("BABAK 1","Tangkap Momen Emas",[["rina","netral"],["doni","netral"]],()=>rules("b1",[[S.av,"berpikir"],["rina","netral"],["doni","netral"]],b1));}

/* Pengecoh: kerja rutin sesuai SOP (−1) dan perilaku kurang baik (−2) */

/* ============ PERMAINAN ============ */

  topbar("Babak 1 · Momen Emas",0);stage.scrollTop=0;
  stage.innerHTML=`<div class="hud"><div class="hcell"><span class="lbl">Momen</span><b id="mc">1/4</b></div>
    <div class="smile"><span class="lbl">Smile Meter tim</span><div class="bar"><i id="sm" style="width:50%"></i></div></div>

   <div class="hand" id="hand"></div><p class="hint2" id="hint">Seret kartu ke orangnya, atau ketuk kartu lalu ketuk orangnya.</p>`;
  const map=$("#map");
  CREW.forEach(id=>{const b=document.createElement("button");b.className="st";b.type="button";b.dataset.id=id;

  nextMomen();
  let last=performance.now();
  const loop=now=>{const dt=Math.min(.1,(now-last)/1000);last=now;if(!G.over){tick(dt);raf=requestAnimationFrame(loop);}};

function place(S,z){S.zona=z;const p=ZONE[z];S.el.style.left=p[0]+"%";S.el.style.top=p[1]+"%";}
function setLabel(S,t,kind){S.label=t;S.kind=kind;S.hit=false;const a=S.el.querySelector(".act");a.textContent=t;a.classList.remove("new");void a.offsetWidth;a.classList.add("new");S.el.classList.remove("hit");}
function toast(t){const e=$("#toast");if(!e)return;e.textContent=t;e.classList.remove("show");void e.offsetWidth;e.classList.add("show");}
function smile(d){G.smile=Math.max(0,Math.min(100,G.smile+d));const b=$("#sm");if(b){b.style.width=G.smile+"%";b.style.background=G.smile>=60?"var(--ok)":G.smile>=35?"#e0a400":"var(--bad)";}}
function score30(){const raw=G.res.reduce((a,r)=>a+r.speed+r.cp,0);return Math.max(0,Math.round(raw*30/40)-G.pen);}
function drawOcc(){const o=$("#oc");if(!o)return;const s=G.seg;o.querySelectorAll("i").forEach((d,k)=>{d.className=s&&k<s.occ-1?"gone":s&&k===s.occ-1&&s.live?"now":"";});}
function randomActivity(S){const bad=Math.random()<.3;setLabel(S,bad?pickOne(BURUK):pickOne(RUTIN),bad?"buruk":"rutin");}

/* ---- Jeda + mulai momen berikutnya ---- */
function nextMomen(){G.mi++;if(G.mi>=MOMEN.length){finish();return;}
  const r=G.res[G.mi],m=r.m;G.seg={r,t:0,occ:0,live:false,paused:true,ending:false};
  $("#mc").textContent=(G.mi+1)+"/4";drawOcc();
  /* susun posisi: orang momen di zonanya, lainnya di tempat acak yang tidak bertabrakan */
  /* orang di kolom yang sama harus berjauhan (min 40% tinggi denah) supaya label tidak menutupi kepala orang lain */
  const jauh=a=>{const ps=a.map(z=>ZONE[z]);for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)if(ps[i][0]===ps[j][0]&&Math.abs(ps[i][1]-ps[j][1])<40)return false;return true;};
  let free=[];for(let t=0;t<400;t++){free=rnd(SPOTS.filter(z=>z!==m.zona));if(jauh([m.zona,...free.slice(-3)]))break;}
  CREW.forEach((id,k)=>{const S=G.staff[id];S.el.classList.remove("done");S.el.querySelector(".hd").innerHTML=face(id,"netral");
    place(S,id===m.id?m.zona:free.pop());randomActivity(S);if(id===m.id)setLabel(S,pickOne(RUTIN),"rutin");S.next=2+Math.random()*3;});
  /* 2 kartu tetap selama momen ini */
  const d=G.decoyPlan[G.mi],pos=G.posPlan[G.mi];const order=pos===0?["personal",d]:[d,"personal"];
  const vi=Math.floor(Math.random()*3);G.hand=order.map(j=>({j,t:KARTU[j].v[vi]}));G.sel=null;drawHand();
  /* panel jeda di atas denah: kartu sudah terlihat, pemain baca dulu */
  const ov=document.createElement("div");ov.className="pause";ov.id="pause";
  ov.innerHTML=`<div class="pbox pop"><span class="lbl" style="color:var(--accent)">Momen ${G.mi+1} dari 4</span><h2>Baca dulu 2 kartumu</h2>
   <p>Kartunya tetap sampai momen ini selesai. Lalu amati tim dan tunggu perilaku yang layak dihargai.</p><button class="btn y" id="ready">Siap</button></div>`;
  $("#map").appendChild(ov);$("#ready").onclick=()=>{ov.remove();G.seg.paused=false;beep(1100,.06,"sine",.05);};}
/* Momen selesai: lanjut ke momen berikutnya setelah peserta menekan Lanjutkan di balon umpan balik */
function endMomen(){const s=G.seg;if(s.ending)return;s.ending=true;s.live=false;drawOcc();}

/* ---- Tangan kartu (tetap selama satu momen) ---- */
function drawHand(){const h=$("#hand");if(!h)return;
  h.innerHTML=G.hand.map((c,i)=>{const k=c.t.indexOf(",");return `<button class="card2 pop" data-i="${i}" type="button"><span class="nm">${esc(c.t.slice(0,k))}</span>${esc(c.t.slice(k))}</button>`;}).join("");
  h.querySelectorAll(".card2").forEach(el=>bindCard(el,+el.dataset.i));}
function bindCard(el,i){let sx=0,sy=0,moved=false,ghost=null,over=null;
  el.onpointerdown=e=>{if(G.over)return;sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId);};
  el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){moved=true;G.drag=i;SFX.grab();
      ghost=document.createElement("div");ghost.className="dragghost";ghost.innerHTML=el.innerHTML;$("#app").appendChild(ghost);el.classList.add("used");}
    if(moved){const r=$("#app").getBoundingClientRect();ghost.style.left=(e.clientX-r.left)+"px";ghost.style.top=(e.clientY-r.top)+"px";
      const t=document.elementFromPoint(e.clientX,e.clientY),st=t&&t.closest&&t.closest(".st");
      if(over&&over!==st)over.classList.remove("over");over=st;if(st)st.classList.add("over");}};
  el.onpointerup=()=>{if(!moved){G.sel=G.sel===i?null:i;document.querySelectorAll(".card2").forEach(c=>c.classList.toggle("sel",+c.dataset.i===G.sel));return;}
    if(ghost)ghost.remove();ghost=null;G.drag=null;el.classList.remove("used");
    if(over){over.classList.remove("over");deliver(i,over.dataset.id);over=null;}};
  el.onpointercancel=()=>{if(ghost)ghost.remove();ghost=null;G.drag=null;el.classList.remove("used");if(over)over.classList.remove("over");over=null;};}

/* ---- Kartu mendarat ---- */
/* Balon umpan balik: label penilaian berwarna (tepat / kurang pas / tidak tepat) + alasan singkat + kalimat yang diucapkan.
   Game berhenti sampai peserta menekan Lanjutkan. after(): yang dijalankan sesudahnya. */
/* Reaksi personel (gimmick, ⚠ karangan): muncul lebih dulu sebagai notifikasi, lalu balon penilaian menyusul.
   rx = {by: id personel, e: ekspresi, t: isi pesan, inner: true kalau "dalam hati"} */
function other(not){const c=CREW.filter(x=>!not.includes(x));return pickOne(c);}
function say(id,text,v,head,why,after,rx){const S=G.staff[id],b=document.createElement("div");b.className="say "+v;
  if(G.seg)G.seg.paused=true;
  /* Urutan baca: hasil + poin → apa yang kamu ucapkan → kenapa begitu. why boleh berupa beberapa kalimat (array). */
  const pts=G.fbPts;G.fbPts=null;const lines=[].concat(why);
  b.innerHTML=`<div class="vtop"><span class="vh">${v==="ok"?"✓":v==="mid"?"!":"✕"} ${esc(head)}</span>${pts!=null?`<span class="vp">${pts>0?"+":pts<0?"−":""}${Math.abs(pts)} poin</span>`:""}</div>
   ${text?`<div class="vq"><small>Kamu bilang</small>“${esc(text)}”</div>`:""}
   <div class="vw"><small>Kenapa</small>${lines.map(esc).join("<br>")}</div><button class="go" type="button">Lanjutkan</button>`;
  document.querySelectorAll(".fbstack,.dim").forEach(o=>o.remove());
  /* Denah diredupkan, orang yang dituju disorot. Reaksi personel dan balon penilaian ditumpuk rapi di bawah denah. */
  const dim=document.createElement("div");dim.className="dim";$("#map").appendChild(dim);S.el.classList.add("focus");
  const stack=document.createElement("div");stack.className="fbstack";$("#map").appendChild(stack);
  if(rx){const nt=document.createElement("div");nt.className="notif "+(rx.e==="senang"?"happy":"sour"); /* warna ikut suasana hati yang bereaksi */
    nt.innerHTML=`<span class="nf">${face(rx.by,rx.e)}</span><span class="nb"><b>${esc(CH[rx.by].name)}${rx.inner?" <i>(dalam hati)</i>":""}</b>${esc(rx.t)}</span>`;
    stack.appendChild(nt);(v==="ok"?SFX.ok:SFX.bad)();}
  const show=()=>{if(G.over)return;stack.appendChild(b);const btn=b.querySelector(".go");btn.focus({preventScroll:true});
    btn.onclick=()=>{stack.remove();dim.remove();S.el.classList.remove("focus");beep(1100,.05,"sine",.04);if(G.over)return;if(after)after();else if(G.seg)G.seg.paused=false;};};
  if(rx)setTimeout(show,1300);else show();}
function deliver(i,id){const s=G.seg;if(G.over||!s||s.paused||s.ending)return;const c=G.hand[i];if(!c)return;
  const S=G.staff[id],nm=CH[id].name,text=c.t.replace("‹nama›",nm);
  G.sel=null;document.querySelectorAll(".card2").forEach(x=>x.classList.remove("sel"));
  if(S.kind==="momen"&&s.live){const r=s.r;r.occ=s.occ;r.speed=SPEED[s.occ-1];r.card=c.j;r.cp=KARTU[c.j].p;r.state="done";
    const late=s.occ>1?`Tapi baru di kesempatan ke-${s.occ}, jadi poin kecepatan berkurang.`:"Diberikan di kesempatan pertama, poin kecepatan penuh.";G.fbPts=r.speed+r.cp;
    endMomen();
    const o=other([id]);
    if(c.j==="personal")say(id,nm+", "+r.m.kal,s.occ>1?"mid":"ok",s.occ>1?"TEPAT, TAPI TELAT":"TEPAT",["Langsung, sebut nama, dan tanpa \"tapi\".",late],nextMomen,
      {by:id,e:"senang",t:pickOne([`Makasih, ${sapa()}! Jadi makin semangat kerjanya.`,`Wah, ternyata ${sapaB()} lihat. Seneng banget dihargai!`,`Siap, ${sapa()}! Besok saya kerjakan lagi kayak gini.`])});
    else if(c.j==="umum")say(id,text,"mid","KURANG PAS","Tidak menyebut nama, jadi terasa umum. Orang yang bekerja tidak merasa dilihat.",nextMomen,
      pickOne([{by:id,e:"lesu",inner:true,t:"Yang ngerjain kan aku… kok yang disebut semua orang?"},{by:o,e:"berpikir",t:"Lho, saya ikut dipuji? Padahal tadi saya nggak ngapa-ngapain."}]));
    else if(c.j==="tapi")say(id,text,"bad","TIDAK TEPAT","Pujian diselipi koreksi, jadi terasa seperti teguran. Sampaikan koreksi di lain waktu.",nextMomen,
      pickOne([{by:o,e:"kesal",t:`Kasihan ${nm}, dipuji sebentar, ujungnya ditegur juga.`},{by:id,e:"kesal",inner:true,t:"Ujung-ujungnya dimarahin juga. Mending nggak usah dipuji."}]));
    else say(id,text,"bad","TIDAK TEPAT","Pujian ditunda ke rapat. Saat itu momennya sudah dingin dan kurang berdampak.",nextMomen,
      pickOne([{by:o,e:"berpikir",t:`Rapat bulanan? Keburu lupa, ${sapa()}. Itu kan baru aja kejadian.`},{by:id,e:"lesu",inner:true,t:"Nunggu sebulan lagi… paling nanti juga lupa."}]));
    const e=c.j==="personal"?"senang":c.j==="umum"?"berpikir":c.j==="tapi"?"kesal":"lesu";
    S.el.querySelector(".hd").innerHTML=face(id,e);S.el.classList.add("done");S.el.classList.remove("glow");
    smile(c.j==="personal"?14:c.j==="umum"?3:-8);(c.j==="personal"?SFX.ok:c.j==="umum"?SFX.mid:SFX.bad)();
    topbar("Babak 1 · Momen Emas",score30());return;}
  if(S.hit)return;S.hit=true;S.el.classList.add("hit");const p=S.kind==="buruk"?2:1;G.pen+=p;G.penLog.push({id,label:S.label,p});
  smile(-5);const o2=other([id]);const act=S.label.charAt(0).toLowerCase()+S.label.slice(1);
  G.fbPts=-p;say(id,text,"bad","SALAH SASARAN",S.kind==="buruk"?`${nm} sedang ${act}. Ini perlu ditegur, bukan dipuji.`:`${nm} sedang ${act}. Itu kerja rutin, belum momen istimewa.`,null,
    S.kind==="buruk"?pickOne([{by:o2,e:"kesal",t:`Hah? ${nm} lagi ${act}, kok malah dipuji? Nggak adil, ${sapa()}!`},{by:o2,e:"kesal",t:`Jadi kalau ${act.split(" ").slice(0,2).join(" ")} dipuji ya, ${sapa()}? Oke deh…`}])
      :pickOne([{by:o2,e:"kesal",t:`Lho, ${nm} cuma ${act}. Saya juga tiap hari begitu, nggak pernah dipuji.`},{by:o2,e:"berpikir",t:`Itu kan memang kerjaan rutin ${nm}, ${sapa()}. Yang lain gimana?`}]));
  topbar("Babak 1 · Momen Emas",score30());}

/* ---- Jam permainan (berhenti saat jeda) ----
   Jadwal kesempatan dalam satu momen: muncul di FIRST, FIRST+SHOW+GAP, FIRST+2(SHOW+GAP); tiap kesempatan terlihat SHOW detik. */
function tick(dt){const s=G.seg;if(!s||s.paused||s.ending)return;s.t+=dt;const r=s.r,M=G.staff[r.m.id];
  const k=Math.floor((s.t-FIRST)/(SHOW+GAP)),inShow=s.t>=FIRST&&k<CHANCES&&(s.t-FIRST)-k*(SHOW+GAP)<SHOW;
  if(inShow&&!s.live){s.live=true;s.occ=k+1;setLabel(M,r.m.label,"momen");SFX.spark();drawOcc();}
  if(!inShow&&s.live){s.live=false;setLabel(M,pickOne(RUTIN),"rutin");M.next=s.t+GAP;drawOcc();
    if(s.occ>=CHANCES){r.state="missed";smile(-8);SFX.bad();endMomen();G.fbPts=0;say(r.m.id,"","bad","TERLEWAT",CH[r.m.id].name+" sudah 2 kali melakukannya, tapi tidak ada yang mengapresiasi. Momen penguatannya hilang.",nextMomen,
      {by:r.m.id,e:"lesu",inner:true,t:"Udah dua kali begini, kok nggak ada yang lihat ya… Buat apa repot-repot."});return;}
    toast("Kesempatan "+s.occ+" terlewat");}
  /* kegiatan lain berganti pelan, tanpa pindah tempat */
  CREW.forEach(id=>{if(id===r.m.id)return;const S=G.staff[id];if(s.t>=S.next){randomActivity(S);S.next=s.t+5+Math.random()*3;}});}

/* ============ HASIL & PELAJARAN ============ */
/* Ringkasan salah sasaran: dikelompokkan per jenis dan per orang, bukan daftar panjang */
function penHTML(){if(!G.penLog.length)return "";

];

/* ============ PERMAINAN ============ */
let G=null,raf=0;
function play(){cancelAnimationFrame(raf);clearTimers();
  G={ci:-1,raw:0,res:[],mist:{umum:0,tapi:0,sifat:0,samar:0,swap:0,binValid:0},over:false,off:0,hold:true,sel:null,P:null,cs:null};
  topbar("Babak 2 · Mesin SBI",S.b[0]);stage.scrollTop=0;
  stage.innerHTML=`<div class="hud"><div class="hcell"><span class="lbl">Kasus</span><b id="kc">1/${CASES.length}</b></div>
    <div class="sbi"><span class="lbl">SBI Completeness</span><div class="seg" id="seg"><i class="S"></i><i class="B"></i><i class="I"></i></div>
     <div class="names"><span>S</span><span>B</span><span>I</span></div></div>
    <div class="hcell"><span class="lbl">Buang</span><b id="bc">0/3</b></div></div>
   <div id="arena">

    <button class="bin" id="bin" type="button" data-t="bin">${BIN}Tempat buang · seret keping yang tidak layak ke sini</button>

  bindBelt();nextCase();
  let last=performance.now();

    if(!G.hold&&G.sel==null&&!G.P)G.off+=SPD*dt;layoutBelt();raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);}

function shake(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");}
function coach(kind,e,b,i){const c=$("#coach");if(!c||!G.cs)return;c.className="coach "+kind;

function nextCase(){G.ci++;if(G.ci>=CASES.length){finish();return;}
  const c=CASES[G.ci],nm=CH[c.id].name;
  const chips=rnd(c.chips).map((d,k)=>({...d,id:"c"+k,b:k,state:"belt"}));

  ov.innerHTML=`<div class="pbox pop"><span class="lbl" style="color:var(--accent)">Kasus ${G.ci+1} dari ${CASES.length}</span><h2>${esc(c.judul)}</h2>
   <p>${esc(c.scene)}</p><p style="font-weight:700">Rakit apresiasinya. Keping yang tidak layak, buang.</p><button class="btn y" id="ready">Siap</button></div>`;
  $("#arena").appendChild(ov);$("#ready").onclick=()=>{ov.remove();G.hold=false;beep(1100,.06,"sine",.05);};}

function layoutBelt(){const b=$("#belt");if(!b||!G.cs)return;const bw=b.clientWidth,U=W+GAP,L=Math.max(NCH*U,bw+U);
  G.cs.chips.forEach(c=>{if(c.state!=="belt")return;let p=(((c.b*U-G.off)%L)+L)%L;if(p>L-U)p-=L;c.el.style.transform=`translateX(${p+GAP/2}px)`;});}
function updSel(){const s=G.sel;document.querySelectorAll(".chip2").forEach(e=>e.classList.toggle("sel",e.dataset.id===s));
  document.querySelectorAll(".slot,.bin").forEach(e=>e.classList.toggle("tgt",s!=null));}
const chipOf=id=>G.cs&&G.cs.chips.find(c=>c.id===id);

/* ---- Sentuhan di ban: ketuk = pilih, seret vertikal = bawa keping, seret horizontal = geser ban ---- */
function bindBelt(){const b=$("#belt");
  b.onpointerdown=e=>{if(G.hold||G.over)return;const el=e.target.closest(".chip2");
    G.P={id:el?el.dataset.id:null,sx:e.clientX,sy:e.clientY,mode:null,off0:G.off,ghost:null,over:null};try{b.setPointerCapture(e.pointerId);}catch(_){}};

      const t=document.elementFromPoint(e.clientX,e.clientY),tg=t&&t.closest&&t.closest(".slot,.bin");

/* ---- Keping dijatuhkan ke kotak S/P/D atau Tempat buang ---- */
function drop(id,t){const cs=G.cs,c=chipOf(id);if(!cs||!c||c.state!=="belt"||cs.done||G.hold)return;

function oops(o){const cs=G.cs,nm=CH[cs.c.id].name;G.hold=true;G.sel=null;updSel();

  stack.appendChild(b);
  const close=()=>{ov.remove();G.hold=false;beep(1100,.05,"sine",.04);};
  b.querySelector(".go").onclick=close;b.querySelector(".x").onclick=close;b.querySelector(".go").focus({preventScroll:true});}

/* ---- Kalimat lengkap: reaksi, lalu penilaian + Lanjutkan ---- */
function complete(){const cs=G.cs,c=cs.c,nm=CH[c.id].name;cs.done=true;G.hold=true;G.sel=null;updSel();
  const pts={};SO.forEach(k=>pts[k]=cs.errs[k]===0?6:cs.errs[k]===1?3:0);
  const bonus=cs.binned===3?2:0,raw=pts.S+pts.B+pts.I+bonus,left=3-cs.binned;
  G.res.push({c,pts,bonus,raw,errs:{...cs.errs}});G.raw+=raw;topbar("Babak 2 · Mesin SBI",S.b[0]+scaled(G.raw));
  const text=nm+", "+lc(cs.slots.S.x)+" "+cs.slots.B.x+" "+cs.slots.I.x;
  const wrong=SO.filter(k=>cs.errs[k]>0);
  const why=[`Kalimatmu menyebut kejadiannya (Situation), tindakan yang terlihat (Behavior), dan akibatnya (Impact). Jadi ${nm} tahu persis apa yang harus diulang.`,
    `Tanpa pujian umum, tanpa "tapi", dan tanpa menilai sifat, pujian terasa tulus dan bisa dipercaya.`];
  const game=[wrong.length?"Salah pasang: "+wrong.map(k=>`${SL[k].n} ${cs.errs[k]}× (kotak ini ${pts[k]}/6)`).join(", ")+".":"Semua keping masuk kotak yang tepat di percobaan pertama (18/18).",
    bonus?"Semua pengecoh terbuang: bonus +2.":`Bonus +2 belum didapat: masih ada ${left} pengecoh di ban.`];
  const good=raw>=16;
  const v=raw>=18?"ok":raw>=12?"ok":raw>=7?"mid":"bad",head=raw>=18?"SBI SEMPURNA":raw>=12?"SBI LENGKAP":raw>=7?"LENGKAP, BANYAK SALAH PASANG":"LENGKAP, TAPI BERANTAKAN";
  const rx=good?{by:c.id,e:"senang",t:pickOne([`Wah, ${sapaB()} ingat persis kejadiannya. Jadi tahu kerja saya ada artinya!`,`Terima kasih, ${sapa()}. Karena detail begitu, saya tahu persis apa yang harus saya ulang.`])}
    :{by:c.id,e:"berpikir",t:`Makasih, ${sapa()}. Maksudnya sudah sampai, cuma tadi ${sapaB()} sempat ragu-ragu mau menyampaikan yang mana, ya?`};
  verdict({v,head,pts:"+"+raw+"/20",text,why,game,rx,after:nextCase});}

function verdict(o){const ov=document.createElement("div");ov.className="fbov";const stack=document.createElement("div");stack.className="fbstack";ov.appendChild(stack);$("#app").appendChild(ov);G.hold=true;
  const b=document.createElement("div");b.className="say "+o.v;

function focusHTML(){const pc=[S.b[0]/30,S.b[1]/35,S.b[2]/35];const w=pc.indexOf(Math.min(...pc));if(pc[w]>=1)return "";
  const tip=["Babak 1 · Langsung: apresiasi saat momennya masih segar, sebut namanya, dan jangan diselipi \"tapi\".",
    "Babak 2 · Spesifik: susun Situation (Situasi) → Behavior (Perilaku) → Impact (Dampak). Buang pujian umum dan penilaian sifat.",
    "Babak 3 · Jujur & proporsional: kadar pujian mengikuti kadar kontribusi. Tidak pelit, tidak lebay, adil untuk semua."][w];
  return `<div class="focus"><div class="cc-k">Fokus perbaikanmu</div><p>${tip}</p></div>`;}
function boardHTML(k,label){if(!k||!k.top||!k.top.length)return `<p class="myrank">Belum ada data untuk tanggal training ini.</p><p class="note">${label}</p>`;
  const ini=r=>r.saya?face(S.av,"senang"):esc(String(r.nama).split(" ").map(w=>w[0]).join("").slice(0,2));
  const pod=[1,0,2].filter(i=>k.top[i]).map(i=>{const r=k.top[i];return `<div class="pod ${["g","s","b"][i]}" style="grid-column:${[2,1,3][i]}"><div class="ava">${ini(r)}</div><div class="pn">${esc(r.nama)}</div><div class="pc">${esc(r.cabang)}</div>${r.saya?'<span class="you">KAMU</span>':""}<div class="pv">${r.skor}</div><div class="block">${r.pos}</div></div>`;}).join("");
  const li=r=>`<li class="${r.saya?"me":""}"><span class="rk">${r.pos}</span><span class="nm">${esc(r.nama)}<small>${esc(r.cabang)}</small></span>${r.saya?'<span class="you">KAMU</span>':""}<span class="sc">${r.skor}</span></li>`;
  let rest=k.top.slice(3).map(li).join("");
  if(k.saya&&!k.top.some(r=>r.saya))rest+=`<li class="gap">···</li>`+li(Object.assign({saya:true},k.saya));
  return `<p class="myrank">${k.saya?`Posisi kamu: <b>#${k.saya.pos}</b> dari ${k.jumlah} peserta`:`Kamu belum masuk klasemen ini · ${k.jumlah} peserta`}</p><div class="podium">${pod}</div>${rest?`<ol class="stand">${rest}</ol>`:""}<p class="note">${label}</p>`;}
let KL=null,KTAB="n";
async function muatKlasemen(){const el=$("#lb");if(!el)return;el.innerHTML=`<p class="myrank">Memuat klasemen…</p>`;
  try{KL=await api("klasemen");gambarKlasemen();}
  catch(e){if(!$("#lb"))return;$("#lb").innerHTML=`<p class="myrank">${esc(e.message)}</p><button class="btn ghost" id="klr" style="margin-top:8px">Muat ulang klasemen</button>`;$("#klr").onclick=muatKlasemen;}}
function gambarKlasemen(){const el=$("#lb");if(!el||!KL)return;
  el.innerHTML=KTAB==="n"?boardHTML(KL.nilai,(DEMO?"Contoh data (mode demo). ":"")+"Nilai resmi peserta dengan tanggal training yang sama."):boardHTML(KL.arcade,"Rekor arcade tertinggi tiap orang. Tidak memengaruhi nilai.");}
function rapor(){clearTimers();const t=total();
  const lulus=S.hasil?S.hasil==="LULUS":t>=75,latihan=S.status==="LATIHAN";
  const badgeOn=(S.resmi&&S.resmi.hasil==="LULUS")||(!latihan&&lulus);
  topbar(latihan?"Rapor latihan":"Rapor MOD-02",t);
  stage.innerHTML=`
   <div class="center"><img class="logo-md" src="${LOGO}" alt="Indomaret" onerror="this.remove()"><div class="face-lg">${face(S.av,lulus?"senang":"berpikir")}</div>
    <div class="score-big">${t}</div><span class="status" style="background:${lulus?"var(--ok)":"var(--bad)"}">${lulus?"LULUS":"REMEDIAL"}</span>
    <p class="muted">${latihan?`Ini latihan (percobaan ke-${S.percobaan}). Nilai resmimu tetap ${S.resmi?S.resmi.total:"–"}.`:lulus?"Selamat, kamu dapat badge Apresiasi!":"Batas lulus 75. Pelajari kartu di bawah, lalu coba latihan."}</p>
    ${S.pending?`<div class="pending">Nilai sudah tersimpan di HP ini dan akan terkirim otomatis saat ada sinyal. Jangan hapus data browser.</div>`:""}</div>
   <div class="badge-row ${badgeOn?"":"locked"}">${BADGE}<div><b>Badge Apresiasi</b><span>${badgeOn?"Terbuka · Modul 2 dari 5":"Terkunci · butuh nilai 75"}</span></div></div>
   ${focusHTML()}
   <div class="panel rows">
    ${[["Babak 1",S.b[0],30],["Babak 2",S.b[1],35],["Babak 3",S.b[2],35]].map(r=>`<div class="row"><span>${r[0]}</span><div class="bar"><b style="width:${r[1]/r[2]*100}%"></b></div><span>${r[1]}/${r[2]}</span></div>`).join("")}
   </div>
   <h3>Kartu insight</h3>
   <div class="insight">
    <div class="ins"><b>Langsung</b><p>Amati → Segera dekati → Sebut nama → Apresiasi → Tutup dengan harapan</p><span>Penguatan paling kuat saat perilakunya masih segar. Jangan tunda ke rapat, jangan selipkan "tapi".</span></div>
    <div class="ins"><b>Spesifik · SBI</b><p>Situation (Situasi) + Behavior (Perilaku) + Impact (Dampak)</p><span>Sebut kejadian, tindakan yang terlihat, dan akibatnya. Bukan "kerja bagus" atau menilai sifat.</span></div>
    <div class="ins"><b>Jujur &amp; proporsional</b><p>Pelit ← Proporsional → Lebay</p><span>Kerja standar diakui, progres disemangati, kontribusi luar biasa diberi apresiasi bermakna. Jangan membandingkan.</span></div>
   </div>
   <div class="league">
    <div class="lg-head"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M10 5h16v8a8 8 0 0 1-16 0z" fill="#f5c542"/><path d="M10 8H5v3a5 5 0 0 0 5 5M26 8h5v3a5 5 0 0 1-5 5" stroke="#f5c542" stroke-width="2.4" fill="none"/><path d="M16 21h4v5h-4z" fill="#d9a92c"/><rect x="11" y="26" width="14" height="5" rx="1.5" fill="#f5c542"/></svg><div><h3>Klasemen Batch</h3><small>Training ${S.peserta?esc(S.peserta.tgl):"hari ini"}</small></div></div>
    <div class="tabs"><button aria-pressed="${KTAB==="n"}" data-tb="n">Nilai resmi</button><button aria-pressed="${KTAB==="a"}" data-tb="a">Rekor arcade</button></div>
    <div id="lb"></div>
   </div>
   <button class="btn y" id="arc">Main Arcade Tangkap SBI</button>
   <button class="btn ghost" id="rep">Main lagi 3 babak (latihan)</button>
`;
  stage.scrollTop=0;
  stage.querySelectorAll("[data-tb]").forEach(b=>b.onclick=()=>{KTAB=b.dataset.tb;stage.querySelectorAll("[data-tb]").forEach(x=>x.setAttribute("aria-pressed",x===b));gambarKlasemen();});
  $("#arc").onclick=()=>arcade("free");$("#rep").onclick=()=>startAttempt();
  muatKlasemen();
  if(S.pending)flush();}
