<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motivasi Tim MOD-05</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#18213a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: aplikasi satu layar, kolom tunggal maks 480px. Konten tampil di panel lembut/gelap, pilihan selalu kartu putih bergaris tepi */
:root{
  --navy:#18213a; --navy-2:#24304f; --ink:#18213a; --muted:#68738a; --line:#dde3ee;
  --bg:#f5f7fb; --page:#e8ecf4; --white:#ffffff;
  --primary:#2d5be3; --primary-soft:#edf1fd; --primary-line:#b9c8f4;
  --accent:#ffc947; --accent-soft:#fff6dc; --accent-ink:#4a3600;
  --ok:#17a057; --ok-soft:#e6f6ec; --bad:#e5484d; --bad-soft:#fdeced;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--navy);color:#fff;min-height:50px}
.top .ttl{font-family:var(--display);font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pts{font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.tag-latihan{font:700 11px var(--body);letter-spacing:.06em;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:3px 7px}
.stripe{height:4px;background:linear-gradient(90deg,#2f6fd0 0 64%,#f2c230 64% 76%,#e2463d 76% 100%)}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-block:16px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
#stage>*{flex-shrink:0}
#stage>.grow{flex-shrink:1}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;font-weight:700} h2{font-size:24px;font-weight:600} h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.lbl{font:700 13px var(--body);color:var(--muted)}
.lbl.c{text-align:center}
/* tombol aksi: gelap; pilihan jawaban: putih bergaris tepi */
.btn{font:600 17px var(--display);letter-spacing:.01em;border:0;border-radius:14px;padding:14px 18px;background:var(--navy);color:#fff;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--navy);color:#fff}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.grow{flex:1}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.panel{background:var(--white);border-radius:18px;padding:16px;border:1px solid var(--line)}
input.nik{font:600 24px var(--display);letter-spacing:.08em;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;width:100%;background:#fff;color:var(--ink)}
input.nik:focus{border-color:var(--primary);outline:none}
.av-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.av-pick button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 6px 12px;cursor:pointer;font:600 17px var(--display);color:var(--ink)}
.av-pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.av-pick svg{width:100%;height:auto;display:block}
.face-lg svg{width:150px;height:auto}
.face-md svg{width:96px;height:auto}
.face-sm svg{width:64px;height:auto}
.fb{min-height:22px;font-weight:700;font-size:15px;color:var(--bad);text-align:center}
.fb.good{color:var(--ok)}
.k-eyebrow{font:700 12px var(--body);letter-spacing:.12em;color:var(--primary)}
.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:10px}
.howto li{counter-increment:h;display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.4}
.howto li::before{content:counter(h);flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font:700 13px var(--display);display:flex;align-items:center;justify-content:center}
.tip{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--accent-ink);text-align:center}
/* rapor */
.score-big{font:700 64px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.status{font:700 14px var(--display);letter-spacing:.08em;border-radius:999px;padding:4px 14px;color:#fff}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:80px 1fr 52px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.row .bar{height:10px;border-radius:9px;background:#e3e8f1;overflow:hidden}.row .bar b{display:block;height:100%;background:var(--primary)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.insight{display:flex;flex-direction:column;gap:10px}
.ins{background:var(--navy);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ins b{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ins p{font:600 16px var(--display);line-height:1.3}
.ins span{font-size:13.5px;opacity:.85}
.league{position:relative;overflow:hidden;background:linear-gradient(160deg,#18213a 0%,#23305a 100%);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.league::before{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,71,.22),transparent 70%);pointer-events:none}
.lg-head{display:flex;gap:10px;align-items:center}.lg-head svg{width:36px;height:36px;flex:none}
.lg-head h3{color:#fff}.lg-head small{display:block;color:#aab4cc;font:600 12px var(--body)}
.league .tabs{background:rgba(255,255,255,.08)}.league .tabs button{color:#aab4cc}.league .tabs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.myrank{font:600 13px var(--body);color:#d6dcea;text-align:center}.myrank b{color:var(--accent)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px var(--display);color:var(--navy);background:#fff;border:3px solid var(--m);overflow:hidden}
.pod.g .ava{width:58px;height:58px}
.pod .ava svg{width:120%;height:auto;margin-top:22px}
.pod .pn{font:600 14px var(--display);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod .pc{font-size:11px;color:#aab4cc}
.pod .pv{font:700 19px var(--display);color:var(--m);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.pod .block{width:100%;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--m),rgba(255,255,255,.05));color:var(--navy);font:700 22px var(--display);display:flex;justify-content:center;padding-top:6px}
.pod.g{--m:#f5c542}.pod.s{--m:#c9d2e0}.pod.b{--m:#d6935c}
.pod.g .block{height:84px}.pod.s .block{height:60px}.pod.b .block{height:44px}
.you{font:700 10px var(--body);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 6px}
.pod .you{margin-top:4px}
.stand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stand li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.stand .rk{width:26px;height:26px;flex:none;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font:700 13px var(--display)}
.stand .nm{flex:1;min-width:0;font-weight:700;font-size:14px}.stand .nm small{display:block;font-weight:600;font-size:11.5px;color:#aab4cc}
.stand .sc{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.stand li.me{background:rgba(255,201,71,.16);box-shadow:inset 3px 0 0 var(--accent)}
.league .note{color:#8f9ab3}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td{padding:7px 6px;border-bottom:1px solid #edf0f5}
.lb td:first-child{width:28px;font-weight:700;color:var(--muted)}
.lb td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lb tr.me td{background:var(--accent-soft);font-weight:700}
.tabs{display:flex;gap:6px;background:#eef1f6;border-radius:12px;padding:4px}
.tabs button{flex:1;font:600 14px var(--display);border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(24,33,58,.12)}
.note{font-size:12px;color:var(--muted);text-align:center}
.inter{position:absolute;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.inter .k{font:700 13px var(--body);letter-spacing:.14em;color:var(--accent)}
.inter h2{font-size:30px}
.concl{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.cc-k{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.cc-h{font:600 18px var(--display);line-height:1.3}
.cc-res{font-weight:700;font-size:14px;border-radius:10px;padding:8px 12px}
.cc-res.ok{background:var(--ok-soft);color:#0f6b3a}.cc-res.mid{background:var(--accent-soft);color:var(--accent-ink)}.cc-res.no{background:var(--bad-soft);color:#a32a2e}
.cc-sub{font:700 13px var(--body);margin-top:4px}.cc-sub.ok{color:var(--ok)}.cc-sub.no{color:var(--bad)}
.concl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.4}
.cc-score{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}.cc-score b{color:var(--ink)}
.aside{font:600 13px var(--body);color:var(--muted);font-style:italic;margin-top:-4px}
.facts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.facts span{font:600 13px var(--body);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink)}
.badge-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.badge-row .badge{width:56px;height:56px;flex:none}
.badge-row b{display:block;font:600 17px var(--display)}.badge-row span{font-size:13px;color:var(--muted)}
.badge-row.locked .badge{filter:grayscale(1);opacity:.45}
.focus{background:var(--accent-soft);border:1px solid #f3dc9a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.focus p{font-weight:600;font-size:14.5px;line-height:1.4}
.fw{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}
.gpill{font:700 11px var(--body);background:var(--navy);color:#fff;border-radius:6px;padding:3px 8px;flex:none}
.logo-pill{background:transparent;padding:0;display:inline-flex;align-items:center;flex:none}
.logo-pill:empty{display:none}
.logo-pill.lg{margin-bottom:6px}
.logo-sm{height:24px;width:auto;display:block}
.logo-md{height:30px;width:auto;display:block}
.logo-lg{height:46px;width:auto;display:block;margin-bottom:4px}
.stand li.gap{background:none;justify-content:center;color:#8f9ab3;padding:0;font-weight:700;letter-spacing:.2em}
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;color:var(--muted);font-weight:600}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{font:600 13px var(--body);background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-line);border-radius:12px;padding:8px 12px;text-align:center;line-height:1.4}
.chip.warn{background:var(--accent-soft);color:var(--accent-ink);border-color:#f3dc9a}
.pending{font:600 12.5px var(--body);background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:8px 12px;text-align:center}
.credit .who{font:700 12.5px var(--body);letter-spacing:.02em;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{position:relative;z-index:6;flex:none;text-align:center;font:600 11px var(--body);letter-spacing:.06em;color:var(--muted);padding-block:6px max(6px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.credit{padding-inline:84px}
.snd{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;gap:6px}
.snd button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.snd button svg{width:18px;height:18px}.snd button.off{color:var(--muted);opacity:.55}.snd button:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Gaya bersama: tambahan global ===== */
:root{--sky:#3ba3e8;--sky-soft:#e6f4fd;--sky-ink:#0e4f7f}
.btn:disabled{opacity:1;background:#c7cedb;color:#56627a;cursor:default}
.sbl{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shake{animation:shk .42s}
@keyframes shk{0%,100%{margin-left:0}20%{margin-left:-9px}40%{margin-left:9px}60%{margin-left:-6px}80%{margin-left:6px}}
.m3leg{margin:0;padding:0;list-style:none;counter-reset:l;display:flex;flex-direction:column;gap:7px}
.m3leg li{counter-increment:l;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px}
.m3leg li::before{content:counter(l);flex:none;width:26px;height:26px;border-radius:8px;background:var(--sky);color:#fff;font:700 14px var(--display);display:flex;align-items:center;justify-content:center}
.m3tip-suara{font:600 13px var(--body);color:var(--sky-ink);background:var(--sky-soft);border-radius:12px;padding:8px 12px;text-align:center}

/* modal umpan balik: wajib ditutup */
.m3modal{position:absolute;inset:0;z-index:9;background:rgba(24,33,58,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.m3mbox{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--bad);max-height:92%;overflow-y:auto}
.m3mbox.ok{border-top-color:var(--ok)}.m3mbox.mid{border-top-color:#e0a400}
.m3mk{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--bad)}
.m3mbox.ok .m3mk{color:var(--ok)}.m3mbox.mid .m3mk{color:#9a7000}
.m3mbox h3{font-size:19px}
.m3mbox p{font-size:15px;line-height:1.45;font-weight:600}
.m3mbox .say{background:var(--bg);border-left:4px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px;line-height:1.4}
.m3mbox .say.ok{border-left-color:var(--ok)}
.m3mbox .remind{background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;line-height:1.4}
.m3mbox .remind b{color:var(--accent)}

/* HUD per babak */
.m3hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.m3hud .hc{display:flex;flex-direction:column;align-items:center;gap:1px}
.m3hud .hc b{font:700 21px/1 var(--display);font-variant-numeric:tabular-nums}
.m3meter{display:flex;flex-direction:column;gap:3px;min-width:0}
.m3meter .bar{height:10px;border-radius:99px;background:#e3e8f1;overflow:hidden}
.m3meter .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .45s,background .45s}
.m3meter .ends{display:flex;justify-content:space-between;font:600 10px var(--body);color:var(--muted)}
.m3scene{display:flex;gap:10px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:8px 12px}
.m3scene .fc{flex:none;width:54px;height:54px;border-radius:12px;background:var(--navy-2);overflow:hidden}
.m3scene .fc svg{width:100%;height:auto;margin-top:2px}
.m3scene b{display:block;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.m3scene p{font-weight:600;font-size:14px;line-height:1.35}
.m3coach{font:600 13.5px var(--body);color:var(--sky-ink);background:var(--sky-soft);border-radius:12px;padding:8px 12px;line-height:1.35}
.m3coach b{font-weight:800}

/* ===== BABAK 1 · Ubah Ancaman Jadi Ajakan ===== */
.m3draft{background:var(--bad-soft);border:1.5px dashed #f0a3a6;border-radius:14px;padding:8px 12px}
.m3draft .tag,.m3script .tag{font:700 10.5px var(--body);letter-spacing:.1em;color:#a32a2e}
.m3draft p{font-weight:700;font-size:14px;color:#a32a2e;text-decoration:line-through;text-decoration-thickness:2px;margin-top:2px;line-height:1.35}
.m3script{background:#fff;border:1.5px solid var(--primary-line);border-radius:14px;padding:8px 12px;min-height:58px}
.m3script .tag{color:var(--primary)}
.m3script #scr{font-weight:600;font-size:14.5px;line-height:1.45;margin-top:2px}
.m3script .pc{background:var(--primary-soft);border-radius:6px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.m3script .pc.new{background:#fff1bf}
.m3script .gap{color:var(--muted);font-weight:700;font-size:13px}
.m3script em,.m3opt em{font-style:italic;color:var(--muted);font-weight:600}
.m3steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.m3steps i{height:6px;border-radius:9px;background:#dde3ee}
.m3steps i.on{background:var(--sky)}.m3steps i.dn{background:var(--ok)}.m3steps i.sl{background:#e0a400}
.m3opts{display:flex;flex-direction:column;gap:8px}
.m3opt{font:600 14.5px/1.38 var(--body);text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;position:relative}
.m3opt:active{background:var(--bg)}
.m3opt.x{background:#f3f4f7;color:#8a93a6;border-style:dashed;cursor:default;text-decoration:line-through}
.m3react{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.m3react .fc{flex:none;width:68px}.m3react .fc svg{width:100%;height:auto}
.m3react p{font-weight:600;font-size:14.5px;line-height:1.4}
.m3react small{display:block;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.m3verdict{border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;line-height:1.4}
.m3verdict b{display:block;font-weight:800}
.m3verdict.ok{background:var(--ok-soft);color:#0f5e34}.m3verdict.mid{background:var(--accent-soft);color:var(--accent-ink)}.m3verdict.no{background:var(--bad-soft);color:#8f2427}

/* ===== BABAK 2 · Tebak & Pilih Nada ===== */
.m3say{background:var(--primary);color:#fff;border-radius:16px;border-bottom-left-radius:4px;padding:10px 13px;font:600 14.5px/1.4 var(--body)}
.m3say small{display:block;font:700 10.5px var(--body);letter-spacing:.1em;color:#cfe0ff;margin-bottom:2px}
.m3dial{display:flex;align-items:center;justify-content:center;gap:10px}
.m3k{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:700 16px var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.m3k:active{background:var(--bg)}
.knob{width:156px;height:132px;flex:none;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.knob svg{width:100%;height:100%;display:block;overflow:visible}
.knob .ndl{transition:transform .22s cubic-bezier(.3,1.4,.6,1)}
.m3station{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.m3station .sh{display:flex;justify-content:space-between;align-items:center}
.m3station .sh b{font:700 15px var(--display)}
.wave{height:46px;display:flex;align-items:center;gap:3px;justify-content:center}
.wave i{display:block;width:7px;border-radius:4px;background:#cfd6e3;transition:height .25s,background .25s}
.wave.known i{background:var(--sky)}
.wave.on i{animation:wv .34s ease-in-out infinite alternate}
.wave.on i:nth-child(3n){animation-delay:.12s}.wave.on i:nth-child(3n+1){animation-delay:.22s}
@keyframes wv{from{transform:scaleY(.45)}to{transform:scaleY(1.1)}}
.ciri{font-weight:600;font-size:13.5px;text-align:center;color:var(--ink);min-height:19px}
.ciri.q{color:var(--muted)}
.m3row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m3seg{display:flex;justify-content:center;gap:6px;align-items:center;font:600 12px var(--body);color:var(--muted)}
.m3seg button{font:700 12px var(--body);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:4px 10px;cursor:pointer}
.m3seg button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-ink)}
.m3seg button:disabled{background:#f3f4f7;color:#a9b0bd;cursor:default}

/* ===== BABAK 3 · Detektor Ekspresi + Tarik Tambang ===== */
.m3rope{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px 6px}
.m3rope .trk{position:relative;height:44px;margin:0 32px}
.m3rope .ln{position:absolute;left:0;right:0;top:20px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#c79a57 0 6px,#a87b3c 6px 12px)}
.m3rope .zone{position:absolute;left:0;width:22%;top:12px;height:21px;border-radius:6px;background:var(--ok-soft)}
.m3rope .knot{position:absolute;top:9px;width:14px;height:27px;margin-left:-7px;border-radius:4px;background:var(--bad);box-shadow:0 0 0 2px #fff;transition:left .6s cubic-bezier(.3,1.3,.6,1)}
.m3rope .end{position:absolute;top:2px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--sky-soft);border:2px solid #fff;box-shadow:0 1px 4px rgba(24,33,58,.2)}
.m3rope .end svg{width:122%;margin:-2px 0 0 -11%}
.m3rope .end.l{left:-32px}.m3rope .end.r{right:-32px}
.m3rope .lab{display:flex;justify-content:space-between;font:700 10.5px var(--body);color:var(--muted);white-space:nowrap;gap:6px}
.m3rope .lab .c{color:var(--sky-ink)}
.tbar{height:6px;border-radius:9px;background:#e3e8f1;overflow:hidden}
.tbar b{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.tbar b.low{background:var(--bad)}
.m3cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m3card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font:inherit;position:relative}
.m3card .m3fw{width:74px;height:80px;overflow:hidden;position:relative}
.m3card .m3fw svg{width:74px;height:auto;position:relative;top:0;left:0}
.m3card .g{font:600 12px/1.3 var(--body);text-align:center}
.m3card.ok{border-color:var(--ok);background:var(--ok-soft)}
.m3card.no{border-color:var(--bad);background:var(--bad-soft)}
.m3card.dim{background:#f3f4f7;color:#8a93a6}
.m3fw.nod svg{animation:nod 1s ease-in-out infinite}
.m3fw.geleng svg{animation:gel .9s ease-in-out infinite}
@keyframes nod{0%,60%,100%{top:0}20%{top:5px}40%{top:-1px}}
@keyframes gel{0%,50%,100%{left:0}12%{left:-5px}25%{left:5px}37%{left:-4px}}

/* ===== Gaya bersama: papan skor arcade ===== */
.m3sb{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:8px 10px}
.m3sb .sbc{display:flex;flex-direction:column;align-items:center;gap:2px}
.m3sb .sbl{color:#aab4cc}
.m3sb b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.m3sb b.low{color:#ff8a8d}
.m3lives{display:flex;gap:2px}.m3lives i{width:20px;height:20px;color:#ff5a64;display:block}.m3lives i svg{width:100%;height:100%;fill:currentColor}
.m3lives i.off{color:#4a5675}
.m3sb .mute{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.m3sb .mute svg{width:20px;height:20px}
.m3hud2{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--body);color:var(--muted)}
.m3combo{display:flex;align-items:center;gap:4px;color:var(--muted)}
.m3combo svg{width:18px;height:18px;fill:#c3cad8}
.m3combo.hot{color:#d0461a}.m3combo.hot svg{fill:#ff7a2e}
.m3rec b{color:var(--ink)}
.m3arena{position:relative;flex:1 1 0;min-height:300px;border-radius:20px;overflow:hidden;background:#cfeafc;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.m3arena canvas{position:absolute;left:0;top:0;display:block}
.m3toast{position:absolute;left:50%;top:-60px;transform:translateX(-50%);background:var(--navy);color:#fff;font:600 13.5px var(--display);padding:7px 14px;border-radius:99px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:3;transition:top .25s ease;pointer-events:none}
.m3toast.show{top:10px}
.m3pop{position:absolute;left:50%;top:-80px;margin-left:-60px;width:120px;text-align:center;font:700 26px var(--display);color:#d0461a;text-shadow:0 2px 0 #fff;z-index:3;pointer-events:none;transition:top .2s ease}
.m3pop.show{top:22%}
.m3hint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(24,33,58,.86);color:#fff;font:600 13px var(--body);text-align:center;border-radius:12px;padding:8px 10px;pointer-events:none}

/* ===== Gaya bersama: ringkas supaya muat di layar HP ===== */

/* ===== Gaya bersama: komponen modul 4 ===== */
/* --- komponen arcade modul 4 --- */
.m4rule{display:flex;flex-direction:column;align-items:center;background:var(--accent);color:var(--navy);border-radius:14px;padding:6px 10px;border:2px solid #e7b21c}
.m4rule .rk{font:700 10.5px var(--body);letter-spacing:.12em;color:#6b5200}

@keyframes m4fl{0%{background:#fff}30%{background:var(--accent)}55%{background:#fff}100%{background:var(--accent)}}
.m4arena{min-height:190px;background:linear-gradient(180deg,#e9f2ff,#d6e6fb);cursor:default;display:flex;align-items:center;justify-content:center}

.m4item.out.d{transition:margin-top .4s ease-in;margin-top:260px}

/* --- komponen meter & ucapan modul 4 --- */

#zona{display:flex;flex-direction:column;gap:9px}

.m4note.ok{background:var(--ok-soft);color:#0f5e34}.m4note.mid{background:var(--accent-soft);color:var(--accent-ink)}.m4note.no{background:var(--bad-soft);color:#8f2427}

.m4tok{display:flex;gap:3px}

const CONFIG={

/* ============ MODE TEMPEL DI LMS ============
   Dibuka dari LMS: index.html?embed=1&nik=123456

   - Saat nilai tersimpan, LMS diberi kabar lewat postMessage.
     LMS tetap memeriksa sendiri sheet Rekap; kabar ini hanya pemicu. */
const QP=(()=>{try{return new URLSearchParams(location.search);}catch(e){return null;}})();
const EMBED=!!QP&&QP.get("embed")==="1"&&window.parent!==window;
let AUTO_NIK=QP?(QP.get("nik")||"").replace(/\D/g,""):"";
const NIK_LMS=AUTO_NIK;
const NIK_KUNCI=EMBED&&!!NIK_LMS;
function kabariLMS(ev,data){if(!EMBED)return;
  try{window.parent.postMessage(Object.assign({sumber:"game-ssl",modul:CONFIG.MODUL,event:ev},data||{}),"*");}catch(e){}}

/* ============ PENYIMPANAN DI HP ============ */
const LSK=k=>"ssl_"+CONFIG.MODUL+"_"+k;
const ls={get(k,d){try{const v=localStorage.getItem(LSK(k));return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(LSK(k));}catch(e){}}};

/* ============ KONEKSI KE APPS SCRIPT ============ */
async function api(aksi,data){
  if(DEMO)return new Promise(r=>setTimeout(()=>r(demoApi(aksi,data||{})),300));
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);let r;
  try{r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({aksi,modul:CONFIG.MODUL,nik:S.nik},data||{})),signal:ctl.signal,redirect:"follow"});}
  catch(e){const x=new Error("Tidak ada sinyal. Cek koneksi internet, lalu coba lagi.");x.net=true;throw x;}
  finally{clearTimeout(to);}
  let j;try{j=await r.json();}catch(e){const x=new Error("Server belum bisa dihubungi. Coba lagi sebentar.");x.net=true;throw x;}
  if(!j.ok){const x=new Error(j.pesan||"Terjadi kesalahan.");x.kode=j.err;throw x;}
  return j;}

/* Antrean kirim: data disimpan di HP dulu, dikirim saat ada sinyal. Aman dikirim ulang. */
const QRES={};let flushing=null;
function enqueue(it){it.t=Date.now();const q=ls.get("q",[]);const i=q.findIndex(x=>x.key===it.key);if(i>=0)q[i]=it;else q.push(it);ls.set("q",q);return flush();}
function flush(){if(flushing)return flushing;
  flushing=(async()=>{for(;;){const q=ls.get("q",[]);if(!q.length)break;const it=q[0];
      try{QRES[it.key]=await api(it.aksi,it.data);}
      catch(e){if(e.net||e.kode==="SIBUK"||e.kode==="SERVER")break;console.warn("Dibuang dari antrean:",it.key,e.message);}
      ls.set("q",ls.get("q",[]).filter(x=>!(x.key===it.key&&x.t===it.t)));}})()
    .finally(()=>{flushing=null;cekPending();});
  return flushing;}
/* Jika nilai yang tadinya tertunda sudah terkirim, rapor diperbarui */
function cekPending(){if(!S.pending||!S.sid)return;const r=QRES["s_"+S.sid];if(!r)return;
  S.pending=false;S.resmi=r.resmi;S.hasil=r.hasil;ls.del("sesi");kabariLMS("selesai",{status:r.status,total:r.total});const el=stage.querySelector(".pending");if(el)el.remove();}
window.addEventListener("online",()=>flush());

/* ============ MODE DEMO (tanpa sheet) ============ */
const DEMO_DB={n:0,resmi:null};
function demoApi(aksi,d){const tgl=new Date().toISOString().slice(0,10);
  if(aksi==="login")return{ok:true,peserta:{nama:"Peserta Demo",cabang:"Demo",tgl},resmi:DEMO_DB.resmi,percobaan:DEMO_DB.n,sesiTerbuka:null,rekorArcade:S.arcadeBest};
  if(aksi==="mulai"){DEMO_DB.n++;return{ok:true,lanjut:false,sesi:{id:"demo-"+DEMO_DB.n,status:DEMO_DB.n===1?"RESMI":"LATIHAN",percobaan:DEMO_DB.n,avatar:d.avatar,tahap:0,b:[0,0,0],ans:[]}};}
  if(aksi==="progres")return{ok:true};
  if(aksi==="selesai"){const t=d.b.reduce((a,x)=>a+x,0),h=t>=75?"LULUS":"REMEDIAL",r=d.id==="demo-1";if(r&&!DEMO_DB.resmi)DEMO_DB.resmi={total:t,hasil:h};
    return{ok:true,status:r?"RESMI":"LATIHAN",total:t,hasil:h,b:d.b,resmi:DEMO_DB.resmi};}
  if(aksi==="arcade")return{ok:true,rekor:Math.max(S.arcadeBest,d.skor)};
  if(aksi==="klasemen"){const mk=(vals,me)=>{const rows=NAMES.map((n,i)=>({nama:n[0],cabang:n[1],skor:vals[i]}));
      if(me!=null)rows.push({nama:"Kamu",cabang:"Demo",skor:me,saya:true});rows.sort((a,b)=>b.skor-a.skor||(a.saya?-1:1));
      const top=rows.slice(0,10).map((r,i)=>Object.assign({pos:i+1},r));const si=rows.findIndex(r=>r.saya);
      return{jumlah:rows.length,top,saya:si>=0?{pos:si+1,nama:"Kamu",cabang:"Demo",skor:rows[si].skor}:null};};
    return{ok:true,tgl,nilai:mk(SAMPLE,DEMO_DB.resmi?DEMO_DB.resmi.total:null),arcade:mk(ARC,S.arcadeBest||null)};}
  return{ok:false,err:"AKSI"};}

function pakaiSesi(s){S.sid=s.id;S.status=s.status;S.percobaan=s.percobaan;S.av=s.avatar==="W"?"sslw":"sslp";

/* ============ SUARA ============
   Semua suara dibuat langsung oleh browser (Web Audio), tanpa file MP3.
   Dua saklar di pojok kanan bawah (footer):
     Speaker = semua suara (efek + musik). Musik = musik latar saja.
   Pilihan peserta tersimpan di HP. Bawaan saat pertama kali dibuka: lihat SUARA_AWAL. */
const SUARA_AWAL={efek:true,musik:true};
let AC=null,MASTER=null,SFXB=null,BGMB=null,NOISE=null;
let MUTE=!SUARA_AWAL.efek,MUSIK=SUARA_AWAL.musik;
try{const v=localStorage.getItem("mod05_mute");if(v!==null)MUTE=v==="1";
  const m=localStorage.getItem("mod05_musik");if(m!==null)MUSIK=m==="1";}catch(e){}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function siapkanJalur(){if(!AC||MASTER)return;
  MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(AC.destination);
  SFXB=AC.createGain();SFXB.gain.value=1;SFXB.connect(MASTER);
  BGMB=AC.createGain();BGMB.gain.value=.55;BGMB.connect(MASTER);}
/* Satu nada. o: w=bentuk gelombang, v=volume, a=attack, ke=meluncur ke frekuensi, bus */
function nada(f,t,d,o){o=o||{};try{const g=AC.createGain(),osc=AC.createOscillator();osc.type=o.w||"triangle";
  osc.frequency.setValueAtTime(f,t);if(o.ke)osc.frequency.exponentialRampToValueAtTime(o.ke,t+d);
  const v=o.v||.1,a=Math.min(o.a||.005,d*.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g).connect(o.bus||SFXB);osc.start(t);osc.stop(t+d+.03);}catch(e){}}
/* Desis (noise) tersaring: untuk whoosh, kartu, kertas, hi-hat */
function desis(t,d,o){o=o||{};try{if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;
  f.type=o.ft||"bandpass";f.frequency.setValueAtTime(o.f||2000,t);if(o.fe)f.frequency.exponentialRampToValueAtTime(o.fe,t+d);f.Q.value=o.q||1;
  const v=o.v||.05;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(o.a||.01,d*.5));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(o.bus||SFXB);s.start(t);s.stop(t+d+.03);}catch(e){}}
function kilau(t){[1568,1976,2349,2637,3136].forEach((f,i)=>nada(f,t+i*.05,.28,{w:"sine",v:.04}));}
const arp=(t,fs,gap,d,o)=>fs.forEach((f,i)=>nada(f,t+i*gap,d,o));

/* ---- Efek per kejadian ---- */
const SFX={
  tap:t=>nada(1500,t,.04,{w:"sine",v:.045}),                                   // tombol umum
  pick:t=>nada(520,t,.09,{v:.09,ke:820}),                                      // B1: kalimat masuk slot
  unpick:t=>nada(760,t,.09,{v:.07,ke:420}),                                    // B1: kalimat dilepas
  select:t=>arp(t,[660,990],.07,.12,{v:.08}),                                  // pilih avatar
  tab:t=>nada(1100,t,.05,{w:"sine",v:.05}),                                    // tab klasemen
  start:t=>arp(t,[523,659,784,1047],.09,.18,{v:.1}),                           // berhasil masuk
  ok:t=>arp(t,[660,880],.07,.12,{v:.11}),                                      // jawaban tepat
  bad:t=>{nada(220,t,.18,{w:"sawtooth",v:.05,ke:150});nada(165,t+.1,.22,{w:"sawtooth",v:.045,ke:110});},
  combo:t=>arp(t,[660,880,1100],.06,.1,{v:.1}),
  level:t=>arp(t,[523,659,784,1047],.08,.16,{v:.11}),
  perfect:t=>{arp(t,[523,659,784,1047],.07,.2,{v:.1});kilau(t+.3);},
  up:t=>nada(500,t,.16,{w:"sine",v:.07,ke:900}),                               // B2: kredibilitas naik
  down:t=>nada(420,t,.22,{w:"sine",v:.07,ke:240}),                             // B2: kredibilitas turun
  msgIn:t=>{nada(880,t,.06,{w:"sine",v:.09,ke:1320});nada(1320,t+.06,.08,{w:"sine",v:.05});},  // B2: chat masuk
  msgOut:t=>{desis(t,.12,{f:1800,fe:4000,v:.03,ft:"highpass"});nada(700,t,.09,{w:"sine",v:.06,ke:1050});}, // B2: chat terkirim
  note:t=>nada(520,t,.25,{w:"sine",v:.05}),                                    // narasi/aksi
  tick:t=>nada(1250,t,.04,{w:"square",v:.03}),                                 // hitung mundur
  deal:t=>desis(t,.16,{f:900,fe:3500,v:.05}),                                  // kartu/situasi baru
  whoosh:t=>desis(t,.55,{f:300,fe:3200,v:.09,a:.22,q:.7}),                     // peralihan babak

const LAGU={
  menu:  {bpm:88, ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],arp:[0,1,2,1,3,2,1,2],arpV:.03, pad:.022,bass:[0,4],bassV:.045},
  chat:  {bpm:84, ch:[[60,64,67],[53,57,60],[57,60,64],[55,59,62]],arp:[0,-1,-1,2,-1,-1,1,-1],arpV:.028,pad:.026,bass:[0],bassV:.04},
  babak: {bpm:100,ch:[[53,57,60],[55,59,62],[52,55,59],[57,60,64]],arp:[0,2,1,2,3,2,1,2],arpV:.03, pad:.018,bass:[0,3,4],bassV:.045,hat:[2,6],hatV:.012},
  kompas:{bpm:124,ch:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]],arp:[0,1,2,1,0,1,2,3],arpV:.024,pad:.01, bass:[0,1,2,3,4,5,6,7],bassV:.03,hat:[1,3,5,7],hatV:.012},
  arcade:{bpm:132,ch:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],arp:[0,1,2,3,2,1,2,1],arpV:.028,pad:0,  bass:[0,2,4,6],bassV:.045,bassOct:[0,12,0,12],hat:[1,3,5,7],hatV:.014,kick:[0,4]}
};
const BGM={mode:null,step:0,next:0};
function musik(m){if(BGM.mode===m)return;BGM.mode=m;BGM.step=0;BGM.next=AC?AC.currentTime+.08:0;}
function musikNanti(m,ms){setTimeout(()=>{if(BGM.mode===null)musik(m);},ms);}
function langkah(L,step,t,sd){const s=step%8,ch=L.ch[Math.floor(step/8)%L.ch.length];
  if(s===0&&L.pad)ch.forEach(n=>nada(mtof(n),t,sd*8*.95,{v:L.pad,a:.25,bus:BGMB}));
  const ai=L.arp[s];if(ai>=0)nada(mtof((ai===3?ch[0]+12:ch[ai])+12),t,sd*.9,{v:L.arpV,bus:BGMB});
  const bi=L.bass.indexOf(s);if(bi>=0)nada(mtof(ch[0]-12+(L.bassOct?L.bassOct[bi]:0)),t,sd*.9,{v:L.bassV,bus:BGMB});
  if(L.hat&&L.hat.includes(s))desis(t,.04,{f:8000,ft:"highpass",v:L.hatV,bus:BGMB});
  if(L.kick&&L.kick.includes(s))nada(150,t,.12,{w:"sine",v:.09,ke:50,bus:BGMB});}
setInterval(()=>{if(MUTE||!MUSIK||!BGM.mode||!AC||AC.state!=="running"||document.hidden)return;
  const L=LAGU[BGM.mode];if(!L)return;siapkanJalur();const sd=60/L.bpm/2;
  if(BGM.next<AC.currentTime)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.2){langkah(L,BGM.step,BGM.next,sd);BGM.step=(BGM.step+1)%(8*L.ch.length);BGM.next+=sd;}},60);

/* ============ ARCADE · ISI ENERGI TIM ============
   Pola sama dengan arcade MOD-01..04: 3 nyawa, combo ×2 mulai 5 beruntun, rekor;
   pemanasan 90 detik sekali (sebelum Babak 1), mode Bebas dari rapor.
   Skor dikirim lewat aksi "arcade" (fase PEMANASAN / BEBAS). Kartu_Benar = jumlah anggota tim yang berhasil disemangati.
   Mekanik: anggota tim muncul di 6 sudut toko (lesu atau semangat). Ketuk yang lesu; tiap ketukan menguras baterai SSL.
   Baterai kosong = tidak bisa menolong. Isi ulang saat 20-50% = bonus RUTIN ("tangki diisi rutin, bukan saat kosong").
   Digambar dengan DOM + SVG wajah. Tanpa transform/opacity pada teks.
   ⚠ Nama sudut toko dan tips: karangan, diturunkan dari prinsip blueprint. */
const WARM=90,TOP=700;
Object.assign(SFX,{
  cheer:t=>arp(t,[784,988,1319],.05,.1,{v:.09}),
  charge:t=>{nada(330,t,.35,{w:"sine",v:.08,ke:880});kilau(t+.3);},
  empty:t=>nada(260,t,.25,{w:"square",v:.04,ke:180})
});
const IET=(()=>{
const TIM=["andi","rina","doni","wati","riko"];
const SUDUT=["Kasir","Rak gondola","Gudang","Chiller","Display depan","Ruang istirahat"];
const ISI=["Rayakan pencapaian kecil hari ini","Ambil istirahat sejenak","Ingat lagi tujuanmu sebagai SSL","Ngobrol hangat dengan tim","Cari inspirasi dari SSL lain"];
const TIPS=["Kamu tidak bisa menuang air dari gelas yang kosong. Jaga energimu dulu.",
  "Isi tangki motivasimu secara rutin, bukan hanya saat sudah kosong.",
  "Perhatikan perubahan dari kebiasaan normal timmu saat briefing pagi.",
  "Satu pendekatan tidak cocok untuk semua orang. Cari dulu penyebabnya."];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let A=null,raf=0,lepas=null;

function play(mode){if(lepas)lepas();cancelAnimationFrame(raf);clearTimers();stage.scrollTop=0;topbar("Isi Energi Tim",0);
  A={mode,score:0,lives:3,streak:0,bestStreak:0,right:0,rutin:0,level:1,t:0,lastRem:-1,over:false,
     en:80,cells:[null,null,null,null,null,null],next:.6,lock:0,isiI:0};
  stage.innerHTML=`<div class="m3sb">
     <div class="sbc"><span class="sbl">Nyawa</span><div class="m3lives" id="lv"></div></div>
     <div class="sbc"><span class="sbl">Level</span><b id="lvl">1</b></div>
     <div class="sbc"><span class="sbl">${mode==="warm"?"Waktu":"Mode"}</span><b id="clock">${mode==="warm"?WARM:"Bebas"}</b></div>
     <button class="mute" id="mute" type="button" aria-label="Suara">${MUTE?SPK_OFF:SPK_ON}</button></div>
   <div class="m3hud2"><span class="m3combo" id="cm">${FLAME}<b>Combo ×0</b></span><span class="m3rec">Rekor <b>${S.arcadeBest}</b> · Top <b>${TOP}</b></span></div>
   <div class="m5bat"><div class="bt"><span class="sbl">Baterai SSL</span><div class="cell" id="batC"><i id="batF"></i><b id="batT">80%</b></div></div>
     <button class="m5isi" id="isi" type="button">⚡ Isi ulang</button></div>
   <div class="m3arena m5arena" id="arena">${SUDUT.map((n,i)=>`<button class="m5cell" type="button" data-i="${i}" aria-label="${n}"><span class="pl">${n}</span><span class="who" id="w${i}"></span><i class="lf" id="l${i}"></i></button>`).join("")}
     <div class="m3toast" id="toast"></div><div class="m3pop" id="sp"></div></div>`;
  const drawLives=()=>{$("#lv").innerHTML=[0,1,2].map(i=>`<i class="${i<A.lives?"":"off"}">${HEART}</i>`).join("");};drawLives();
  const drawCombo=()=>{const c=$("#cm");c.querySelector("b").textContent="Combo ×"+A.streak;c.classList.toggle("hot",A.streak>=5);};
  const drawBat=()=>{const f=$("#batF"),t=$("#batT");if(!f)return;const e=Math.max(0,Math.round(A.en));f.style.width=e+"%";
    f.style.background=e<20?"var(--bad)":e<50?"#e0a400":"var(--ok)";t.textContent=e+"%";};
  $("#mute").onclick=()=>{setMute(!MUTE);$("#mute").innerHTML=MUTE?SPK_OFF:SPK_ON;};
  let tT=0,pT=0;
  const toast=t=>{const el=$("#toast");if(!el)return;el.textContent=t;el.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>el.classList.remove("show"),1300);};
  const pop=t=>{const el=$("#sp");if(!el)return;el.textContent=t;el.classList.add("show");clearTimeout(pT);pT=setTimeout(()=>el.classList.remove("show"),600);};
  const life=()=>Math.max(1.25,2.7-.2*(A.level-1));
  const maxAktif=()=>Math.min(4,2+Math.floor((A.level-1)/2));
  function kosongkan(i){A.cells[i]=null;const w=$("#w"+i),l=$("#l"+i),c=stage.querySelector(`.m5cell[data-i="${i}"]`);
    if(w)w.innerHTML="";if(l)l.style.width="0%";if(c)c.className="m5cell";}
  function munculkan(){const kos=A.cells.map((c,i)=>c?-1:i).filter(i=>i>=0);if(!kos.length)return;
    if(A.cells.filter(Boolean).length>=maxAktif())return;
    const i=pick(kos),aktif=A.cells.filter(Boolean).map(c=>c.who);let who=pick(TIM.filter(w=>!aktif.includes(w)));if(!who)who=pick(TIM);
    const lesu=Math.random()<.68;A.cells[i]={who,lesu,t:0,life:life()+(lesu?0:-.3),done:false};
    $("#w"+i).innerHTML=face(who,lesu?"lesu":"senang");stage.querySelector(`.m5cell[data-i="${i}"]`).className="m5cell on "+(lesu?"lesu":"ok");}
  function ketuk(i){if(A.over)return;const c=A.cells[i];if(!c||c.done)return;const el=stage.querySelector(`.m5cell[data-i="${i}"]`);
    if(A.lock>0){toast("Sedang isi ulang…");return;}
    if(!c.lesu){A.en=Math.max(0,A.en-8);A.streak=0;drawCombo();drawBat();sfx("bad");buzz(80);goyang(el);toast(CH[c.who].name+" sudah semangat. Energimu terbuang.");return;}
    if(A.en<12){sfx("empty");buzz(120);goyang($("#batC"));toast("Baterai kosong! Isi ulang dulu.");return;}
    c.done=true;A.en-=12;A.streak++;A.right++;A.bestStreak=Math.max(A.bestStreak,A.streak);
    const cepat=c.t<=c.life*.4,mult=A.streak>=5?2:1,g=(10+(cepat?5:0))*mult;A.score+=g;
    topbar("Isi Energi Tim",A.score);drawCombo();drawBat();pop((cepat?"CEPAT! ":"")+"+"+g);sfx(cepat?"perfect":"cheer");
    $("#w"+i).innerHTML=face(c.who,"senang");el.className="m5cell on ok done";
    setTimeout(()=>{if(!A.over&&A.cells[i]===c)kosongkan(i);},380);
    if(A.right%10===0){A.level++;$("#lvl").textContent=A.level;sfx("level");setTimeout(()=>toast("Level "+A.level+"! Tim makin butuh kamu"),300);}
    else if(A.streak===5){sfx("combo");setTimeout(()=>toast("Combo ×2 aktif!"),250);}}
  function isiUlang(){if(A.over||A.lock>0)return;if(A.en>=95){toast("Baterai masih penuh.");return;}
    const sebelum=A.en;A.lock=.7;sfx("charge");$("#isi").classList.add("on");
    const tip=ISI[A.isiI++%ISI.length];
    if(sebelum>=20&&sebelum<=50){A.score+=5;A.rutin++;pop("RUTIN! +5");topbar("Isi Energi Tim",A.score);toast("⚡ "+tip);}
    else if(sebelum<12)toast("Jangan tunggu kosong! ⚡ "+tip);
    else toast("⚡ "+tip);
    A.target=Math.min(100,sebelum+45);}
  function miss(i){const c=A.cells[i];kosongkan(i);if(!c.lesu)return;
    A.lives--;A.streak=0;drawLives();drawCombo();sfx("bad");buzz(120);toast(CH[c.who].name+" terlewat. Semangatnya makin turun.");
    if(A.lives<=0)end();}

  stage.querySelectorAll(".m5cell").forEach(b=>b.addEventListener("pointerdown",e=>{if(e.button>0)return;e.preventDefault();ketuk(+b.dataset.i);}));
  $("#isi").onclick=isiUlang;
  const kd=e=>{if(e.repeat)return;const n="123456".indexOf(e.key);if(n>=0){e.preventDefault();ketuk(n);}else if(e.key===" "||e.key==="Enter"||e.key==="e"||e.key==="E"){e.preventDefault();isiUlang();}};
  window.addEventListener("keydown",kd);lepas=()=>{window.removeEventListener("keydown",kd);lepas=null;};
  drawBat();

  let last=performance.now();
  const loop=now=>{if(A.over)return;const dt=Math.min(.05,(now-last)/1000);last=now;A.t+=dt;
    if(A.mode==="warm"){const rem=Math.max(0,WARM-Math.floor(A.t));if(rem!==A.lastRem){A.lastRem=rem;const c=$("#clock");if(c){c.textContent=rem;c.classList.toggle("low",rem<=10);}if(rem<=5&&rem>0)sfx("tick");}
      if(rem<=0){end();return;}}
    /* baterai turun pelan; saat isi ulang, naik bertahap */
    if(A.lock>0){A.lock-=dt;A.en=Math.min(A.target,A.en+(45/.7)*dt);if(A.lock<=0){A.lock=0;A.en=A.target;const b=$("#isi");if(b)b.classList.remove("on");}}
    else A.en=Math.max(0,A.en-1.1*dt);
    drawBat();
    A.next-=dt;if(A.next<=0){munculkan();A.next=Math.max(.42,1.05-.08*(A.level-1))*(.75+Math.random()*.5);}
    for(let i=0;i<6;i++){const c=A.cells[i];if(!c||c.done)continue;c.t+=dt;const l=$("#l"+i);if(l)l.style.width=Math.max(0,100*(1-c.t/c.life))+"%";
      if(c.t>=c.life){miss(i);if(A.over)return;}}
    raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);

  function end(){if(A.over)return;A.over=true;cancelAnimationFrame(raf);if(lepas)lepas();clearTimeout(tT);clearTimeout(pT);
    S.arcadeRuns++;if(mode==="warm")S.warmDone=true;
    if(S.nik){const id=S.nik+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      enqueue({key:"a_"+id,aksi:"arcade",data:{nik:S.nik,idKirim:id,fase:mode==="warm"?"PEMANASAN":"BEBAS",skor:A.score,benar:A.right,level:A.level,durasi:Math.round(A.t)}});}
    const best=Math.max(S.arcadeBest,A.score),nb=A.score>S.arcadeBest&&A.score>0;S.arcadeBest=best;musik(null);sfx(nb?"record":"gameover");musikNanti("menu",2500);
    topbar("Isi Energi Tim",A.score);
    stage.innerHTML=`<div class="center">
      <div class="face-lg">${face(S.av,A.score>=250?"senang":"berpikir")}</div>
      <h2>${mode==="warm"?"Pemanasan selesai!":"Permainan selesai"}</h2>
      <div class="score-big">${A.score}</div>

let G=null;

  else if(s===4)pilihan("Langkah 5 · Kalimat motivasi:","pilih kalimat yang kamu ucapkan bersama resepnya.",k.kal,"kal");
  else if(s===5){log(`<span class="sys">⏩ ${esc(isi(k.pantau.sit))}</span>`,"sy");pilihan("Langkah 6 · Pantau 1–2 minggu:","apa yang kamu lakukan sekarang?",k.pantau.opt,"pantau");}
  else selesaiKasus();}
function pilihan(judul,hint,list,jenis){$("#coach").innerHTML=`<b>${judul}</b> ${hint}`;G.opts=rnd(list);G.jenis=jenis;
  $("#zona").innerHTML=`<div class="m3opts" id="opts">${G.opts.map((o,i)=>`<button class="m3opt" type="button" data-i="${i}">${esc(isi(o.t))}</button>`).join("")}</div>`;
  $("#opts").querySelectorAll(".m3opt").forEach(b=>b.onclick=()=>pilih(+b.dataset.i,b));if(G.si>0)skrol("#zona");}
function benar(p,teks,cls){G.sc[G.si]=p;G.raw+=p;G.moral+=p===2?12:6;drawMoral();sfx(p===2?"ok":"pick");topbar("Babak 3 · Klinik",skala());
  if(teks)log(teks,cls||"me");G.si++;setTimeout(langkah,250);}
function keliru(btn,k,title,why){G.salahNow=1;G.busy=true;G.moral-=8;drawMoral();goyang(btn);sfx("bad");buzz(120);
  m3modal({k,title,body:`<p>${esc(why)}</p>${REMIND}<p class="muted" style="font-size:13px">Pilih lagi.</p>`,btn:"Pilih lagi",
    done:()=>{G.busy=false;btn.classList.add("x");btn.setAttribute("aria-disabled","true");}});}
function pilih(i,btn){if(G.busy||btn.classList.contains("x"))return;const o=G.opts[i];
  if(o.ok){G.busy=true;benar(G.salahNow?1:2,`<b>Kamu:</b> "${esc(isi(o.t))}"`,"me");return;}
  keliru(btn,G.jenis==="pantau"?"Pantau belum tepat":G.jenis==="kal"?"Kalimat kurang tepat":"Pendekatan kurang tepat",LANGKAH[G.si],o.why);}
/* Langkah 2: dengarkan tanpa menghakimi. Tiap giliran: "Hmm, lalu?" atau godaan menyela. */
function dengar(){const k=G.k,c=k.cerita[G.ceritaI];
  if(!c){G.busy=true;$("#zona").innerHTML="";const p=Math.max(0,2-G.sela);G.sc[1]=p;G.raw+=p;G.moral+=p===2?12:p?4:0;drawMoral();topbar("Babak 3 · Klinik",skala());
    log(`<span class="sys">${G.sela?`Kamu menyela ${G.sela} kali.`:"Kamu mendengarkan sampai tuntas tanpa menghakimi."}</span>`,"sy");G.si++;sfx(p===2?"ok":"pick");setTimeout(langkah,300);return;}
  G.busy=false;log(`<b>${esc(CH[k.to].name)}:</b> "${esc(isi(c.c))}"`,"them");sfx("msgIn");
  $("#coach").innerHTML=`<b>Langkah 2 · Dengarkan:</b> biarkan ${esc(CH[k.to].name)} bercerita tuntas.`;
  const o=rnd([{t:"Hmm, lalu?",ok:1},{t:c.x}]);
  $("#zona").innerHTML=`<div class="m5listen" id="opts">${o.map((x,i)=>`<button class="m5l ${x.ok?"":"tg"}" type="button" data-i="${i}">${x.ok?"💬 ":"🗯️ "}${esc(isi(x.t))}</button>`).join("")}</div>`;
  $("#opts").querySelectorAll(".m5l").forEach(b=>b.onclick=()=>{if(G.busy)return;const x=o[+b.dataset.i];
    if(x.ok){G.ceritaI++;log(`<b>Kamu:</b> (mengangguk) "Hmm, lalu?"`,"me");dengar();return;}
    G.busy=true;G.sela++;G.moral-=8;drawMoral();goyang(b);sfx("bad");buzz(120);log(`<b>Kamu:</b> "${esc(isi(x.t))}"`,"me cut");
    m3modal({k:"Menyela",title:"Dengarkan tanpa menghakimi",body:`<p>Nasihat, perbandingan, dan teguran di tengah cerita membuat ${esc(CH[k.to].name)} berhenti terbuka. Beri ruang ia bercerita. Mendengar saja sudah langkah pertama pemulihan.</p>`,btn:"Dengarkan lagi",
      done:()=>{G.busy=false;G.ceritaI++;dengar();}});});
  skrol("#zona");}
function diagnosis(){const k=G.k;$("#coach").innerHTML=`<b>Langkah 3 · Diagnosis:</b> dari ceritanya, apa penyebab utama demotivasinya?`;
  const o=G.dopts=SEBAB.slice();
  $("#zona").innerHTML=`<div class="m5diag" id="opts">${o.map((x,i)=>`<button class="m5dg" type="button" data-i="${i}">${esc(x.n)}</button>`).join("")}</div>`;
  $("#opts").querySelectorAll(".m5dg").forEach(b=>b.onclick=()=>{if(G.busy||b.classList.contains("x"))return;const x=o[+b.dataset.i];
    if(x.id===k.sebab){G.busy=true;b.classList.add("ok");benar(G.salahNow?1:2,`<span class="sys">🩺 Diagnosis: <b>${esc(x.n)}</b></span>`,"sy");return;}
    keliru(b,"Diagnosis meleset","Diagnosis",`Petunjuk di ceritanya: ${CH[k.to].name} ${k.kunci}. Identifikasi penyebab dulu sebelum bertindak, karena penyebab berbeda membutuhkan intervensi berbeda.`);});
  skrol("#zona");}
function resep(){const k=G.k;$("#coach").innerHTML=`<b>Langkah 4 · Resep:</b> ambil intervensi yang cocok dari laci.`;
  const o=G.ropts=rnd(SEBAB);
  $("#zona").innerHTML=`<div class="m5laci" id="opts">${o.map((x,i)=>`<button class="m5lc" type="button" data-i="${i}"><i>💊</i>${esc(x.r)}</button>`).join("")}</div>`;
  $("#opts").querySelectorAll(".m5lc").forEach(b=>b.onclick=()=>{if(G.busy||b.classList.contains("x"))return;const x=o[+b.dataset.i];
    if(x.id===k.sebab){G.busy=true;b.classList.add("ok");benar(G.salahNow?1:2,`<span class="sys">💊 Resep: <b>${esc(x.r)}</b></span>`,"sy");return;}
    keliru(b,"Resep tidak cocok","Resep",`"${x.r}" adalah resep untuk ${x.n.toLowerCase()}. Untuk ${SEBAB.find(s=>s.id===k.sebab).n.toLowerCase()}, pilih resep yang menjawab penyebabnya.`);});
  skrol("#zona");}
function selesaiKasus(){const k=G.k,pts=G.sc.reduce((a,x)=>a+x,0),hi=pts>=10;drawSteps();
  G.res.push({k,sc:G.sc.slice(),pts,hi,sela:G.sela});
  sfx(hi?"perfect":"mid");$("#coach").outerHTML="";
  $("#zona").innerHTML=`<div class="m5rm ${hi?"ok":"no"}"><div class="h"><span>📋 KARTU REKAM MEDIS MOTIVASI</span><b>${esc(CH[k.to].name)}</b></div>
     <div class="r"><span>Penyebab</span><b>${esc(SEBAB.find(s=>s.id===k.sebab).n)}</b></div>
     <div class="r"><span>Resep</span><b>${esc(SEBAB.find(s=>s.id===k.sebab).r)}</b></div>
     <div class="r"><span>2 minggu kemudian</span><b>${esc(hi?k.rekam.ok:k.rekam.lo)}</b></div></div>
    <div class="m3react"><div class="fc">${face(k.to,hi?"senang":"lesu")}</div><div><small>${esc(CH[k.to].name)}</small><p>"${esc(isi(hi?"Makasih, ‹sapa›. Saya jadi semangat lagi.":"…Iya, ‹sapa›. Saya coba."))}"</p></div></div>
    <div class="m3verdict ${hi?"ok":"no"}"><b>${pts}/12 poin mentah</b>${hi?"Pendekatanmu tepat sasaran. Bawahan yang dibantu di titik terendahnya akan jauh lebih loyal.":"Ada langkah yang meleset. Motivasi pulih lebih lambat, dan demotivasi bisa menular."}</div>
    <button class="btn y" id="nx">${G.ci+1<KASUS.length?"Pasien berikutnya":"Lihat hasil Babak 3"}</button>`;
  $("#nx").onclick=next;skrol("#nx");}

/* ============ HASIL & PELAJARAN ============ */
function finish(){const total=Math.min(35,skala());
  const lemah=[0,1,2,3,4,5].map(i=>G.res.filter(r=>r.sc[i]<2).length),maks=Math.max(...lemah);
  const FOK=[["Dekati secara personal","Mulai dengan perhatian: \"Saya perhatikan kamu belakangan kelihatan beda. Ada yang bisa saya bantu?\" Bukan teguran atau ceramah."],
    ["Dengarkan tanpa menghakimi","Tahan nasihat, perbandingan, dan teguran. Beri ruang ia bercerita sampai tuntas."],
    ["Identifikasi penyebab","Kelelahan, merasa tidak dihargai, konflik, monoton, atau masalah pribadi. Penyebab berbeda butuh resep berbeda."],
    ["Resep sesuai penyebab","Satu pendekatan tidak cocok untuk semua orang. Cocokkan intervensi dengan penyebabnya."],
    ["Kalimat motivasi","Akui usahanya secara spesifik, tanpa \"tapi\" yang menghapus pengakuanmu."],
    ["Pantau 1–2 minggu","Motivasi yang sedikit tapi rutin lebih efektif. Jika belum membaik, lakukan pendekatan ulang."]];
  const fokus=maks===0?["Pertahankan","Kamu menjalankan 5 langkah dengan tepat untuk tiap penyebab yang berbeda."]:FOK[lemah.indexOf(maks)];
  S.b[2]=total;S.ans=S.ans.filter(x=>!/^B3/.test(x));
  S.ans.push("B3:"+G.res.map(r=>r.k.to.slice(0,3)+":"+r.sc.join("")).join(","));
  sfx(total>=28?"perfect":total>=18?"ok":"down");topbar("Hasil · Babak 3",total);stage.scrollTop=0;
  stage.innerHTML=`<div class="center"><div class="face-lg">${face(S.av,total>=26?"senang":"berpikir")}</div><span class="sbl">Babak 3</span>
   <div class="score-big">${total}<span style="font-size:24px;color:var(--muted)">/35</span></div></div>
   <div class="panel"><table class="m3tb"><thead><tr><th>Pasien</th><th>Langkah</th><th>Poin</th></tr></thead><tbody>${G.res.map(r=>`<tr>
     <td><b>${esc(CH[r.k.to].name)}</b><br><span class="muted" style="font-size:12px">${esc(SEBAB.find(s=>s.id===r.k.sebab).n)}</span></td>
     <td>${r.sc.map((x,i)=>`<span class="dot ${x===2?"b":"s"}" title="${LANGKAH[i]}">${i+1}</span>`).join("")}</td><td>${r.pts}/12</td></tr>`).join("")}</tbody></table>
     <p class="muted" style="margin-top:8px;font-size:12px">Hijau = tepat di pilihan pertama. Nilai mentah ${G.raw}/36 diskalakan ke 35.</p></div>
   <div class="ins"><b>Fokus perbaikan · ${esc(fokus[0])}</b><p>${esc(fokus[1])}</p></div>
   <div class="ins"><b>Pelajaran · Resep sesuai penyebab</b><p>Lelah → kurangi beban · Tidak dihargai → apresiasi spesifik · Konflik → mediasi · Monoton → tantangan baru · Pribadi → empati</p><span>Dekati personal → Dengarkan → Identifikasi → Intervensi → Pantau 1–2 minggu.</span></div>
   <button class="btn y" id="nx">Lihat rapor</button>`;
  $("#nx").onclick=selesai;}

return {play,stop:()=>{},dbg:()=>G};
})();

/* ============ RAPOR ============ */
const BADGE='<svg class="badge" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 40 14 60l10-5 6 8 4-21z" fill="#e2463d"/><path d="M44 40l6 20-10-5-6 8-4-21z" fill="#2f6fd0"/><circle cx="32" cy="28" r="22" fill="#f5c542"/><circle cx="32" cy="28" r="17" fill="#ffe08a" stroke="#d9a92c" stroke-width="2"/><path d="M24 29l6 6 11-13" stroke="#8a6500" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NAMES=[["Dewi A.","Bekasi"],["Rudi H.","Cikarang"],["Sari P.","Bogor"],["Agus W.","Tangerang"],["Maya K.","Depok"],["Hendra S.","Bekasi"],["Lina R.","Bogor"],["Fajar N.","Cikarang"],["Tono B.","Depok"]];
const SAMPLE=[96,91,88,84,80,77,72,66,58];const ARC=[420,380,350,300,260,240,210,170,120];
function focusHTML(){const pc=[S.b[0]/30,S.b[1]/35,S.b[2]/35];const w=pc.indexOf(Math.min(...pc));if(pc[w]>=1)return "";
  const tip=["Babak 1 · Isi gelasmu dulu: kenali tanda kejenuhanmu, lalu isi ulang dengan merayakan pencapaian kecil, delegasi dan istirahat, relasi hangat, dan mengingat tujuan.",
    "Babak 2 · Baca sinyal dari baseline: bandingkan perilaku minggu ini dengan kebiasaan normalnya. Perubahan adalah sinyal, bukan kesimpulan. Dekati dan tanya dulu.",
    "Babak 3 · Resep sesuai penyebab: dekati personal, dengarkan tanpa menghakimi, identifikasi penyebab, beri intervensi yang cocok, lalu pantau 1–2 minggu."][w];
  return `<div class="focus"><div class="cc-k">Fokus perbaikanmu</div><p>${tip}</p></div>`;}
function boardHTML(k,label){if(!k||!k.top||!k.top.length)return `<p class="myrank">Belum ada data untuk tanggal training ini.</p><p class="note">${label}</p>`;
  const ini=r=>r.saya?face(S.av,"senang"):esc(String(r.nama).split(" ").map(w=>w[0]).join("").slice(0,2));
  const pod=[1,0,2].filter(i=>k.top[i]).map(i=>{const r=k.top[i];return `<div class="pod ${["g","s","b"][i]}" style="grid-column:${[2,1,3][i]}"><div class="ava">${ini(r)}</div><div class="pn">${esc(r.nama)}</div><div class="pc">${esc(r.cabang)}</div>${r.saya?'<span class="you">KAMU</span>':""}<div class="pv">${r.skor}</div><div class="block">${r.pos}</div></div>`;}).join("");
  const li=r=>`<li class="${r.saya?"me":""}"><span class="rk">${r.pos}</span><span class="nm">${esc(r.nama)}<small>${esc(r.cabang)}</small></span>${r.saya?'<span class="you">KAMU</span>':""}<span class="sc">${r.skor}</span></li>`;
  let rest=k.top.slice(3).map(li).join("");
  if(k.saya&&!k.top.some(r=>r.saya))rest+=`<li class="gap">···</li>`+li(Object.assign({saya:true},k.saya));
  return `<p class="myrank">${k.saya?`Posisi kamu: <b>#${k.saya.pos}</b> dari ${k.jumlah} peserta`:`Kamu belum masuk klasemen ini · ${k.jumlah} peserta`}</p><div class="podium">${pod}</div>${rest?`<ol class="stand">${rest}</ol>`:""}<p class="note">${label}</p>`;}
let KL=null,KTAB="n";
async function muatKlasemen(){const el=$("#lb");if(!el)return;el.innerHTML=`<p class="myrank">Memuat klasemen…</p>`;
  try{KL=await api("klasemen");gambarKlasemen();}
  catch(e){if(!$("#lb"))return;$("#lb").innerHTML=`<p class="myrank">${esc(e.message)}</p><button class="btn ghost" id="klr" style="margin-top:8px">Muat ulang klasemen</button>`;$("#klr").onclick=muatKlasemen;}}
function gambarKlasemen(){const el=$("#lb");if(!el||!KL)return;
  el.innerHTML=KTAB==="n"?boardHTML(KL.nilai,(DEMO?"Contoh data (mode demo). ":"")+"Nilai resmi peserta dengan tanggal training yang sama."):boardHTML(KL.arcade,"Rekor arcade tertinggi tiap orang. Tidak memengaruhi nilai.");}
function rapor(){clearTimers();const t=total();

  stage.innerHTML=`
   <div class="center"><img class="logo-md" src="${LOGO}" alt="Indomaret" onerror="this.remove()"><div class="face-lg">${face(S.av,lulus?"senang":"berpikir")}</div>
    <div class="score-big">${t}</div><span class="status" style="background:${lulus?"var(--ok)":"var(--bad)"}">${lulus?"LULUS":"REMEDIAL"}</span>
    <p class="muted">${latihan?`Ini latihan (percobaan ke-${S.percobaan}). Nilai resmimu tetap ${S.resmi?S.resmi.total:"–"}.`:lulus?"Selamat, kamu dapat badge Motivator!":"Batas lulus 75. Pelajari kartu di bawah, lalu coba latihan."}</p>
    ${S.pending?`<div class="pending">Nilai sudah tersimpan di HP ini dan akan terkirim otomatis saat ada sinyal. Jangan hapus data browser.</div>`:""}</div>
   <div class="badge-row ${badgeOn?"":"locked"}">${BADGE}<div><b>Badge Motivator</b><span>${badgeOn?"Terbuka · Modul 5 dari 5":"Terkunci · butuh nilai 75"}</span></div></div>
   ${focusHTML()}
   <div class="panel rows">
    ${[["Babak 1",S.b[0],30],["Babak 2",S.b[1],35],["Babak 3",S.b[2],35]].map(r=>`<div class="row"><span>${r[0]}</span><div class="bar"><b style="width:${r[1]/r[2]*100}%"></b></div><span>${r[1]}/${r[2]}</span></div>`).join("")}
   </div>
   <h3>Kartu insight</h3>
   <div class="insight">
    <div class="ins"><b>1 · Isi Gelasmu Dulu</b><p>Ingat tujuan · Rayakan pencapaian kecil · Jaga fisik &amp; delegasi · Relasi hangat · Inspirasi luar</p><span>Kamu tidak bisa menuang air dari gelas yang kosong. Isi tangki motivasimu secara rutin.</span></div>
    <div class="ins"><b>2 · Baca Sinyal dari Baseline</b><p>Terlambat · Menarik diri · Hilang inisiatif · Produktivitas turun · Keluhan menular</p><span>Bandingkan dengan kebiasaan normalnya. Perubahan adalah sinyal, bukan kesimpulan: dekati dan tanya dulu.</span></div>
    <div class="ins"><b>3 · Resep Sesuai Penyebab</b><p>Dekati → Dengarkan → Identifikasi → Intervensi → Pantau</p><span>Lelah: kurangi beban · Tidak dihargai: apresiasi spesifik · Konflik: mediasi · Monoton: tantangan baru · Pribadi: empati.</span></div>
   </div>
   <div class="league">
    <div class="lg-head"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M10 5h16v8a8 8 0 0 1-16 0z" fill="#f5c542"/><path d="M10 8H5v3a5 5 0 0 0 5 5M26 8h5v3a5 5 0 0 1-5 5" stroke="#f5c542" stroke-width="2.4" fill="none"/><path d="M16 21h4v5h-4z" fill="#d9a92c"/><rect x="11" y="26" width="14" height="5" rx="1.5" fill="#f5c542"/></svg><div><h3>Klasemen Batch</h3><small>Training ${S.peserta?esc(S.peserta.tgl):"hari ini"}</small></div></div>
    <div class="tabs"><button aria-pressed="${KTAB==="n"}" data-tb="n">Nilai resmi</button><button aria-pressed="${KTAB==="a"}" data-tb="a">Rekor arcade</button></div>
    <div id="lb"></div>
   </div>
   <button class="btn y" id="arc">Main Arcade Isi Energi Tim</button>
   <button class="btn ghost" id="rep">Main lagi 3 babak (latihan)</button>
`;
  stage.scrollTop=0;
  stage.querySelectorAll("[data-tb]").forEach(b=>b.onclick=()=>{KTAB=b.dataset.tb;stage.querySelectorAll("[data-tb]").forEach(x=>x.setAttribute("aria-pressed",x===b));gambarKlasemen();});
  $("#arc").onclick=()=>arcade("free");$("#rep").onclick=()=>startAttempt();
  muatKlasemen();
  if(S.pending)flush();}
